  /movie/{movie_id}/release_dates:
    get:
      tags:
      - Movies
      summary: Release Dates
      description: |-
        Retrieves the release information for a specific movie across different countries and distribution channels.

        ## Common use cases

        - Display country-specific release dates.
        - Show regional age ratings.
        - Build localized movie catalogs.
        - Track theatrical, digital, television, and physical releases.
        - Determine when a movie became available in a particular market.

        ## Release types

        TMDB classifies releases using the following numeric values:

        | Type | Release type | Description |
        | --- | --- | --- |
        | `1` | Premiere | Initial premiere at a festival or special event before general release. |
        | `2` | Theatrical (Limited) | Limited theatrical release in selected cinemas. |
        | `3` | Theatrical | Wide theatrical release. |
        | `4` | Digital | Released through digital streaming or online purchase/rental platforms. |
        | `5` | Physical | Released on physical media such as DVD or Blu-ray. |
        | `6` | TV | Broadcast on television. |

        ## Understanding release dates

        A movie may have multiple release records because:

        - It can be released in different countries on different dates,
        - It may have multiple release formats (theatrical, digital, TV, physical),
        - Each country applies its own content certification.

        For example:

        | Country | Release type | Release date | Certification |
        | --- | --- | --- | --- |
        | United States | Theatrical | October 15, 1999 | R |
        | United Kingdom | Digital | November 1, 1999 | 18 |
        | Canada | Physical | December 1, 1999 | 18A |

        Each of these appears as a separate release record.

        ## Certification vs. release type

        | Field | Purpose |
        | --- | --- |
        | `certification` | Indicates the content rating assigned by a country's rating authority (for example, **R**, **PG-13**, or **18**). |
        | `type` | Indicates **how** the movie was released, such as theatrical, digital, television, or physical media. |

        For example:

        ```json
        {
          "certification": "PG-13",
          "type": 4
        }
        ```

        This means that the movie received a **PG-13** content rating, and this particular release record represents its **digital release**.

        Tip: If your application only needs the movie's primary release date, use the **Get Movie Details** endpoint. Use **Get Release Dates** when you need comprehensive release information across multiple countries, release channels, or content rating systems. But keep in mind that a **single country can contain multiple release records.** For example, the United States may have separate entries for a limited theatrical release, a wide theatrical release, a digital release, and a physical media release.
      operationId: getMovieReleaseDates
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: movie_id
        in: path
        required: true
        description: The TMDB ID of the movie.
        schema:
