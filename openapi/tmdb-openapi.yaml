  /movie/{movie_id}/keywords:
    get:
      tags:
      - Movies
      summary: Keywords
      description: |-
        Retrieves the keywords associated with a specific movie. Keywords are descriptive tags that represent themes, topics, settings, events, or concepts related to a movie.

        ## Common use cases

        - Categorize movies using descriptive themes.
        - Improve search relevance and filtering.
        - Build recommendation engines based on shared keywords.
        - Discover movies with similar themes or concepts.
        - Enrich movie metadata for analytics or content management.

        ## Keywords vs. genres

        Although both keywords and genres describe a movie, they serve different purposes.

        | Genres | Keywords |
        | --- | --- |
        | Broad categories that classify a movie. | Specific tags that describe themes, topics, settings, or plot elements. |
        | Limited set of predefined categories. | More detailed and descriptive metadata. |
        | Example: **Action**, **Comedy**, **Drama** | Example: **time travel**, **serial killer**, **space exploration**, **coming of age** |

        For example, two movies may both belong to the **Science Fiction** genre, but one may have the keywords **artificial intelligence** and **space exploration**, while the other has **time loop** and **parallel universe**. Keywords provide the additional context needed to distinguish movies with similar genres.
      operationId: getMovieKeywords
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: movie_id
        in: path
        required: true
        description: The TMDB ID of the movie.
        schema:
          type: integer
          example: 550
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieKeywordsResponse'
