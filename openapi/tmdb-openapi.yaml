openapi: 3.0.0
info:
  title: TMDB API Documentation
  version: 1.0.0
  description: "# Overview\n\nThe Movie Database (TMDB) API is a RESTful web service that provides you with access to a rich
    collection of movie, television, person, and account data. As a developer, you can use the API to search for content,
    retrieve detailed metadata, manage user accounts, create watchlists, rate media, and build personalized entertainment
    applications. The API is organized around [REST ](http://en.wikipedia.org/wiki/Representational_State_Transfer) (Representational
    State Transfer) principles. Meaning, it has predictable resource-oriented URLs, accepts JSON request bodies, returns [JSON-encoded](http://www.json.org/)
    responses, and uses standard HTTP methods such as **GET**, **POST**, and **DELETE**.\n\nIn this API documentation guide,
    you will find practical explanations of 52 TMDB API endpoints, including authentication workflows, account management,
    movies, TV shows, people, search, lists, ratings, watchlists, and others.\n\nEach endpoint includes a clear explanation
    of the request requirements, parameters, example requests, responses, error handling, and implementation notes to help
    integrate TMDB efficiently into your applications.\n\n## API versions\n\nTMDB currently supports two authentication models:
    **API v3** and **API v4**. While both versions provide access to TMDB resources, they serve different purposes and use
    different authentication mechanisms.\n\n### API v3\n\nAPI v3 is the original TMDB API and remains the most commonly used
    version for application development. It supports both public data retrieval and authenticated user actions through session-based
    authentication.\n\nFor read-only endpoints, requests can be authenticated using a Bearer Token. Endpoints that modify
    user-specific data (such as creating ratings, managing favorites, or updating watchlists) require a valid **v3 session
    ID**, which is created through the authentication workflow using a request token approved by the user.\n\nThis documentation
    primarily uses the **v3 authentication workflow**, including:\n\n- Creating a request token\n    \n- Authenticating the
    request token\n    \n- Creating a session ID\n    \n- Accessing authenticated endpoints using the session ID\n    \n\n\
    This approach reflects the authentication flow used throughout the majority of the documented endpoints in this collection.\n\
    \n### API v4\n\nAPI v4 introduces a modern authentication model designed around user-authorized access tokens. Instead
    of relying primarily on session-based authentication, v4 uses [OAuth-style](https://oauth.net/2/access-tokens/) token
    authorization, allowing users to explicitly grant applications permission to access their TMDB account.\n\nSome endpoints
    support converting a user-authorized v4 token into a v3 session, enabling applications to interact with endpoints that
    still require session-based authentication. However, this workflow requires the user to grant write permissions during
    the authorization process before the token can be used successfully.\n\nAlthough TMDB supports both authentication models,
    many user-specific endpoints continue to rely on the v3 session workflow, which is why this collection focuses primarily
    on API v3 authentication.\n\n## Project scope\n\nThis collection documents and tests 52 TMDB API endpoints across multiple
    resource groups, including authentication, search, discover, movies, and networks. Beyond demonstrating successful requests,
    the documentation also includes parameter explanations, authentication requirements, practical use cases, common error
    responses, and troubleshooting guidance based on real testing scenarios encountered during implementation.\n\nThe objective
    of this project is not only to demonstrate API testing but also to showcase professional API documentation practices that
    help developers understand, integrate, and troubleshoot the TMDB API effectively.\n\n# Getting started\n\nBefore you begin
    working with the APIs, complete the following requirements.\n\n## Prerequisite\n\nTo start using this collection, you
    need:\n\n- A TMDB account.\n    \n- A valid TMDB API Read Access Token (Bearer Token).\n    \n- A configured environment
    with the required variables.\n    \n- A v3 session ID for endpoints that perform authenticated user actions, such as ratings
    and account states.\n    \n\nIf you don't have a registered TMDB account, follow the steps below to get one. This is necessary
    to get the API Key and API Access Tokens for your API calls.\n\n### **Step 1: Create a TMDB account**\n\n- Visit the [TMDB
    website](https://www.themoviedb.org/signup).\n    \n- Select **Join TMDB**.\n    \n\n<img src=\"https://content.pstmn.io/40eec610-97ce-4d7f-8e3a-1f2351838ec4/RnJhbWUgMTE2ODcucG5n\"\
    >\n\n- Verify your email address.\n    \n- Log in to your account with your **Username** and **Password**.\n    \n\n###
    Step 2: Request an API key\n\nAfter creating your account:\n\n- Log in with your credentials and navigate to **Settings**.\n\
    \    \n- Scroll down the menu list on the left-hand side and select **API**.\n    \n- Scroll to your **API Read Access
    Token** and **API Key**\n    \n\n<img src=\"https://content.pstmn.io/8f8a600f-fac0-433f-8a9f-977464f00e5f/RnJhbWUgMTE2OTEucG5n\"\
    >\n\n**Note**: The displayed **API Read Access Token** and **API Key** are the two major credentials you need to make
    API calls. However, they function differently. Here's the difference.\n\n| Credential | Purpose |\n| --- | --- |\n| API
    Read Access Token | Access public TMDB resources |\n| API Key | Alternative authentication method |\n\nWith your credentials
    in hand, you are now ready to make your first API call.\n\n## Store your credentials in an environment variable\n\nAfter
    you have obtained your **API Key** and **Access Token**, before you start making your API calls, it is advisable to set
    up an environment variable. The environment variable serves as a placeholder for values that may change or must be reused
    across several requests. These variables allow you to hold and repeat parameters in requests, collections, scripts, and
    so on. Meaning, with your credentials in an environment variable, you don't need to hardcode them every time you want
    to make an API call. Also, if we need to modify a value, you only have to do so in one place.\n\nIn this collection, we
    use the following variables:\n\n#### Core variables\n\n- `{{base_url}}` → Base TMDB API URL\n    \n- `{{image_base_url}}`
    → Base URL for image assets\n    \n\n#### Authentication variables\n\n- `{{access_token}}` → Bearer token for API authentication\n\
    \    \n- `{{session_id}}` → User session ID for account endpoints\n    \n\n#### Resource variables\n\n- `{{movie_id}}`
    → Default movie identifier used for testing\n    \n- `{{tv_id}}` → Default TV show identifier\n    \n- `{{person_id}}`
    → Default person identifier\n    \n\n#### Optional variables\n\n- `{{page}}` → Pagination control\n    \n- `{{language}}`
    → Response language\n    \n\nTo learn more about creating and using environment variables in your API calls, refer to
    your API client documentation.\n\n### Base URL\n\nAll requests are made against the TMDB v3 API:\n\n[<b>https://api.themoviedb.org/3</b>](https://api.themoviedb.org/3)\n\
    \n## **Make your first request**\n\n```bash\ncurl --request GET \\\n--url \"https://api.themoviedb.org/3/movie/550\" \\\
    \n--header \"Authorization: Bearer YOUR_ACCESS_TOKEN\"\n\n ```\n\n```javascript\nconst response = await fetch(\n\"https://api.themoviedb.org/3/movie/550\"\
    ,\n{ headers: { Authorization: \"Bearer YOUR_ACCESS_TOKEN\" } }\n);\nconst movie = await response.json();\nconsole.log(movie);\n\
    \n ```\n\n```python\nimport requests\nresponse = requests.get(\n    \"https://api.themoviedb.org/3/movie/550\",\n    headers={\"\
    Authorization\": \"Bearer YOUR_ACCESS_TOKEN\"}\n)\nprint(response.json())\n\n ```\n\n### Example response\n\n``` http\n\
    200 OK\n\n ```\n\n``` json\n{\n  \"adult\": false,\n  \"id\": 550,\n  \"title\": \"Fight Club\",\n  \"original_language\"\
    : \"en\",\n  \"overview\": \"A ticking-time-bomb insomniac and a soap salesman channel primal male aggression into a shocking
    new form of therapy.\",\n  \"release_date\": \"1999-10-15\",\n  \"runtime\": 139,\n  \"vote_average\": 8.4,\n  \"vote_count\"\
    : 30000,\n  \"genres\": [\n    {\n      \"id\": 18,\n      \"name\": \"Drama\"\n    }\n  ]\n}\n\n ```\n\n### Response
    breakdown\n\n| Field | Type | Description |\n| --- | --- | --- |\n| adult | boolean | Indicates whether the movie contains
    adult content. |\n| id | integer | Unique TMDB identifier for the movie. |\n| title | string | Movie title. |\n| original_language
    | string | Original language of the movie. |\n| overview | string | Brief summary of the movie. |\n| release_date | string
    | Official release date. |\n| runtime | integer | Movie duration in minutes. |\n| vote_average | number | Average user
    rating. |\n| vote_count | integer | Number of user ratings submitted. |\n| genres | array | List of genres associated
    with the movie. |\n\n### What's next?\n\nNow that you've successfully retrieved a movie, you can:\n\n- Search for movies
    using the Search API.\n    \n- Retrieve TV show details.\n    \n- Explore trending content.\n    \n- Authenticate a user
    to access account-specific endpoints such as favorites, ratings, and watchlists."
servers:
  - url: https://api.themoviedb.org/3
paths:
  /authentication:
    get:
      summary: Validate key
      responses:
        '200':
          description: Validate key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationValidationResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 7
                status_message: 'Invalid API key: You must be granted a valid key.'
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Validates your TMDB API credentials by confirming that the supplied API key or access token is recognized
        and authorized to access the TMDB API.\n\n> Note: You only need your Bearer token or API key for this endpoint. \n\
        \  \n\n# Example request (API Key)\n\n```\nGET {{base_url}}/authentication\n    /validate_key?api_key={{api_key}}\n\
        \n ```\n\nOr, if you're using a Bearer token:\n\n```\nGET {{base_url}}/authentication/validate_key\nAuthorization:
        Bearer {{access_token}}\n\n ```\n\n# Example success response\n\n``` json\n{\n  \"success\": true,\n  \"status_code\"\
        : 1,\n  \"status_message\": \"Success.\"\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n\
        | `success` | Indicates whether the supplied credentials are valid. |\n| `status_code` | TMDB status code describing
        the result. |\n| `status_message` | Human-readable description of the validation result. |\n\n## Endpoint-specific
        error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution |\n| --- | --- |
        --- | --- | --- |\n| 401 | Unauthorized | `{ \"success\": false, \"status_code\": 7, \"status_message\": \"Invalid
        API key: You must be granted a valid key.\" }` | \\* Incorrect API key.  <br>\\* API key has been revoked.  <br>\\
        * Missing Authorization header.  <br>\\* Typographical error in the API key. | \\* Verify that the API key is correct.\
        \  <br>\\* Ensure the Bearer token is valid.  <br>\\* Check that the request is sent to the correct API version. \
        \ <br>\\* Confirm that the Authorization header is properly formatted. |\n\n# Common use cases\n\nYou can use this
        endpoint for the following tasks:\n\n- Verify API credentials during application setup.\n    \n- Confirm that an API
        key or access token is valid.\n    \n- Test API connectivity before making authenticated requests.\n    \n- Troubleshoot
        authentication or configuration issues.\n    \n- Validate credentials in automated deployment or CI/CD pipelines before
        running API-dependent tasks.\n    \n\n**Note**: This endpoint only validates your API credentials. It does not create
        a user session or authenticate a TMDB user account."
      operationId: validateApiKey
  /authentication/token/new:
    get:
      summary: Create Request Token
      parameters: []
      responses:
        '200':
          description: Create Request token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTokenResponse'
              example:
                success: true
                expires_at: '{{expires_at}}'
                request_token: '{{request_token}}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 7
                status_message: 'Invalid API key: You must be granted a valid key.'
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Generates a temporary request token used in the TMDB user authentication workflow.\n\n> Note: You only
        need your Bearer token or API key for this endpoint. \n  \n\n# Example request\n\nUsing an API key:\n\n```\nGET {{base_url}}/authentication/token/new?api_key={{api_key}}\n\
        \n ```\n\nOr using a Bearer token:\n\n```\nGET {{base_url}}/authentication/token/new\nAuthorization: Bearer {{access_token}}\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"success\": true,\n  \"expires_at\": \"2026-06-15 16:12:45
        UTC\",\n  \"request_token\": \"{{request_token}}\"\n}\n\n ```\n\n# Response fields\n\n| Field | Type | Description
        |\n| --- | --- | --- |\n| `success` | Boolean | Indicates whether the request completed successfully. |\n| `expires_at`
        | String | Date and time when the request token expires. |\n| `request_token` | String | Temporary token used to obtain
        user approval and create a session. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example
        response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{ \"success\"\
        : false, \"status_code\": 7, \"status_message\": \"Invalid API key: You must be granted a valid key.\" }` | \\* Incorrect
        API key.  <br>\\* API key has been revoked.  <br>\\* Missing Authorization header.  <br>\\* Typographical error in
        the API key. | \\* Verify that the API key is correct.  <br>\\* Ensure the Bearer token is valid.  <br>\\* Check that
        the request is sent to the correct API version.  <br>\\* Confirm that the Authorization header is properly formatted.
        |\n\n# Authentication workflow\n\nAfter generating a request token:\n\n1. Open the following URL in your preferred
        browser:\n    \n\n```\nhttps://www.themoviedb.org/authenticate/{request_token}\n\n ```\n\nReplace `{request_token}`
        with the value returned by this endpoint.\n\n1. Sign in to TMDB (if prompted).\n    \n2. Select **Approve** to authorize
        your application.\n    \n3. Use the validated request token to create a user session.\n    \n\n# Note\n\n- A request
        token **must be approved** before it can be exchanged for a session ID.\n    \n- The approval step can be completed
        in a web browser.\n    \n- The request token expires after a period of time. If this happens before approval or session
        creation, generate a new one.\n    \n- An unapproved or expired request token cannot be used to create a session.\n\
        \    \n\nAlso, a request token alone does not authenticate a user. It simply initiates the authentication process.\n\
        \nThe complete workflow is:\n\n1. Validate API credentials\n    \n2. Create request token\n    \n3. Approve the returned
        token in a web browser\n    \n4. Create session\n    \n5. Use the session ID to access authenticated endpoints\n \
        \   \n\n# Common use cases\n\nYou can use this endpoint for the following tasks:\n\n- Start the TMDB user authentication
        workflow.\n    \n- Obtain user authorization before creating a session.\n    \n- Enable access to user-specific endpoints
        such as Favorites, Watchlists, Ratings, and Account Details.\n    \n- Authenticate users in applications that require
        personalized TMDB features."
      operationId: createRequestToken
  /authentication/session/new:
    post:
      summary: Create Session
      parameters: []
      responses:
        '200':
          description: Create session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                success: true
                session_id: '{{session_id}}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 33
                status_message: Invalid request token.
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Creates a v3 `session_id` by exchanging a previously validated request token. The returned ID represents
        an authenticated TMDB user session and is required to access account-specific endpoints.\n\n> **Note**: This endpoint
        is the final step in the standard TMDB v3 authentication workflow. \n  \n\n# Prerequisites\n\nBefore calling this
        API, ensure you have:\n\n- A valid request token generated using the **Create Request Token** endpoint.\n    \n- A
        request token that has been validated through either:\n    \n    - the browser approval flow, or\n        \n    -
        the **Create Session (with Login)** (`validate_with_login`) endpoint.\n        \n- A request token that has not expired
        or already been exchanged for a session.\n    \n\n# Request body\n\n| Field | Type | Required | Description |\n| ---
        | --- | --- | --- |\n| `request_token` | String | Yes | A validated request token obtained during the authentication
        workflow. |\n\n# Example request and body\n\n```\nPOST {{base_url}}/authentication/session/new\n\n ```\n\n``` json\n\
        {\n  \"request_token\": \"{{request_token}}\"\n}\n\n ```\n\n# Example success response\n\n``` json\n{\n  \"success\"\
        : true,\n  \"session_id\": \"{{session_id}}\"\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- |
        --- |\n| `success` | Indicates whether the session was created successfully. |\n| `session_id` | The authenticated
        user's v3 session ID. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response |
        **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{ \"success\": false, \"\
        status_code\": 33, \"status_message\": \"Invalid request token.\" }` | \\* The request token is invalid.  <br>\\*
        The request token has expired.  <br>\\* The request token has not been approved or validated.  <br>\\* The request
        token has already been exchanged for a session. | \\ * Generate a new request token if the current one has expired.\
        \  <br>\\* Validate the request token using either the browser approval flow or the Create Session (with Login) endpoint.\
        \  <br>\\* Retry the request using a valid, approved request token. |\n\n# Common use cases\n\n- Complete the TMDB
        v3 authentication workflow.\n    \n- Create an authenticated user session.\n    \n- Access account-specific endpoints
        such as Favorites, Watchlists, Ratings, and Account Details.\n    \n- Maintain an authenticated session across multiple
        API requests.\n    \n- Enable personalized features within an application.\n    \n\n**Note:** A `session_id` represents
        an authenticated TMDB user session. Store it securely and reuse it for subsequent authenticated requests instead of
        creating a new session for every API call. If the user signs out or the session is no longer needed, invalidate it
        using the **Delete Session** endpoint."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_token:
                  type: string
              required:
                - request_token
            example:
              request_token: '{{request_token}}'
        required: true
      operationId: createSession
  /authentication/guest_session/new:
    get:
      summary: Create Guest Session
      responses:
        '200':
          description: Create Guest session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
              example:
                success: true
                guest_session_id: '{{guest_session_id}}'
                expires_at: '{{expires_at}}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Creates a temporary guest session and returns a unique ID that allows users who are not signed in to perform
        supported actions, such as rating movies and TV shows.\n\n> Note: Guest sessions are intended for anonymous users
        and do not provide access to account-specific features such as favorites, watchlists, or account states. Also, guest
        sessions provide limited permissions and should not be used as a substitute for a standard authenticated user session.\
        \ \n  \n\n## Example request\n\n```\nGET {{base_url}}/authentication/guest_session/new\n\n ```\n\n## Example success
        response\n\n``` json\n{\n  \"success\": true,\n  \"guest_session_id\": \"{{guest_session_id}}\",\n  \"expires_at\"\
        : \"2027-01-18 02:41:33 UTC\"\n}\n\n ```\n\n## Response field\n\n| Field | Description |\n| --- | --- |\n| `success`
        | Indicates whether the guest session was created successfully. |\n| `guest_session_id` | A unique identifier used
        to authenticate supported guest actions. |\n| `expires_at` | The date and time when the guest session expires. |\n\
        \n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{`  <br>`success\": false, \"status_code\": 3, \"status_message\"\
        : \"Authentication failed: You do not have permissions to access the service.\" }` | \\* The Bearer token is missing
        or invalid.  <br>\\* The API Read Access Token has been revoked or is incorrectly configured. | \\* Verify that the
        Authorization header contains a valid Bearer token.  <br>\\* Confirm that your TMDB API credentials are active and
        correctly configured. |\n\n# Common use cases\n\n- Allow anonymous users to rate movies or TV shows.\n    \n- Support
        temporary user interactions without requiring account registration.\n    \n- Enable quick onboarding experiences by
        postponing sign-in.\n    \n- Collect ratings from users who do not wish to create a TMDB account.\n    \n\n# Guest
        session vs. standard user session\n\n| Guest session | Standard user session |\n| --- | --- |\n| Does not require
        a TMDB account. | Requires a TMDB account and user authentication. |\n| Uses a `guest_session_id`. | Uses a `session_id`.
        |\n| Supports a limited set of operations, such as rating content. | Supports all authenticated account features.
        |\n| Cannot access personal account data. | Can access favorites, watchlists, ratings, account states, and custom
        lists. |\n| Intended for anonymous users. | Intended for authenticated users. |\n\nThe diagram below further expatiates
        on this:\n\n<img src=\"https://content.pstmn.io/4f6e0ea9-a563-46e7-9e29-953d6c9019fa/Xy0gdmlzdWFsIHNlbGVjdGlvbiAoMykucG5n\"\
        >"
      operationId: createGuestSession
  /authentication/session/convert/4:
    post:
      summary: Create Session (from v4 token)
      responses:
        '200':
          description: Create Session (from v4 token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                success: true
                session_id: '{{session_id}}'
        '401':
          description: Create Session (from v4 token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 36
                status_message: This token hasn't been granted write permission by the user.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      description: "Creates a v3 `session_id` using a user-authorized v4 access token.\n\n> **Note:** Unlike the standard
        **Create Session** endpoint, which exchanges a validated request token for a session, this endpoint creates a v3 session
        directly from a user-authorized v4 access token. Therefore, it is intended for applications that use the TMDB v4 authentication
        flow but still need a v3 session to access endpoints that require session-based authentication. \n  \n\n# Prerequisites\n\
        \nBefore calling this API, ensure you have:\n\n- A valid user-authorized v4 access token.\n    \n- A v4 access token
        with write permission.\n    \n\n> **Note:** Do not use your standard TMDB **Read Access Token**, as it is intended
        for application authentication and cannot be exchanged for a v3 session. \n  \n\n# Example request\n\n```\nPOST {{base_url}}/authentication/session/convert/4\n\
        Authorization: Bearer {{v4_access_token}}\n\n ```\n\n# Example success response\n\n``` json\n{\n  \"success\": true,\n\
        \  \"session_id\": \"{{session_id}}\"\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n\
        | `success` | Indicates whether the session was created successfully. |\n| `session_id` | The newly created v3 session
        ID. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes**
        | Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{ \"success\": false, \"status_code\": 36,
        \"status_message\": \"This token hasn't been granted write permission by the user.\" }` | \\* A standard TMDB Read
        Access Token was supplied instead of a user-authorized v4 access token.  <br>\\* The v4 access token has not been
        granted write permission by the user.  <br>\\* The supplied access token is invalid or has expired. | \\* Create a
        new v4 request token.  <br>\\* Ask the user to authorize the token through the TMDB authorization flow.  <br>\\* Exchange
        the approved request token for a user-authorized v4 access token.  <br>\\* Retry the request using the authorized
        access token. |\n\n# Note\n\n- This endpoint is intended for applications using the TMDB v4 authentication workflow.\n\
        \    \n- The supplied v4 access token must be authorized and include write permission.\n    \n- A standard TMDB Read
        Access Token cannot be used to create a v3 session.\n    \n- The returned `session_id` can be used with any v3 endpoint
        that requires session-based authentication.\n    \n\nAlso, most applications using only the TMDB v3 API do not need
        this endpoint. Use **Create Session** if you are following the standard v3 authentication workflow. This endpoint
        is primarily intended for applications that authenticate users through the TMDB v4 API but need to interact with v3
        endpoints that require a `session_id`.\n\n# Common use cases\n\nYou can use the create session (from v4 token) for
        the following tasks:\n\n- Convert an authenticated v4 user session into a v3 session.\n    \n- Access v3 endpoints
        that require a `session_id`.\n    \n- Support applications that integrate both the TMDB v3 and v4 APIs.\n    \n- Reuse
        an existing authenticated v4 user session without repeating the v3 authentication workflow.\n    \n\nTip: TMDB provides
        two different Bearer tokens, and they are not interchangeable:\n\n| Token | Purpose |\n| --- | --- |\n| **Read Access
        Token** | Authenticates your application for public API requests. It cannot create a v3 session. |\n| **User-authorized
        v4 Access Token** | Represents an authenticated TMDB user and can be exchanged for a v3 `session_id` using this endpoint.
        |\n\nIf you receive **Status Code 36**, the most common cause is that you're using the standard **Read Access Token**
        instead of a user-authorized v4 access token with write permission."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
              required:
                - access_token
            example:
              access_token: '{{v4_access_token}}'
        required: true
      operationId: createSessionFromV4Token
  /authentication/token/validate_with_login:
    post:
      summary: Create Session (with Login)
      responses:
        '200':
          description: Create session (with login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTokenResponse'
              example:
                success: true
                expires_at: '{{expires_at}}'
                request_token: '{{request_token}}'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 30
                status_message: Invalid username and/or password.
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Validates a previously generated request token using a TMDB username and password.\n\n# Prerequisites\n\
        \nBefore calling this endpoint, ensure you have:\n\n1. A valid request token generated using the **Create Request
        Token** endpoint.\n    \n2. A valid TMDB username and password for the user.\n    \n3. A request token that has not
        expired.\n    \n\n> **Note**: Once the request token has been successfully validated, it can be exchanged for a v3
        session ID, allowing your application to access authenticated, user-specific resources such as account details, favorites,
        watchlists, ratings, and account states. Unlike the browser-based approval flow, this endpoint validates the request
        token programmatically by submitting the user's TMDB credentials directly to the API. \n  \n\n# Request body\n\n|
        Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| `username` | String | Yes | The user's TMDB
        username. |\n| `password` | String | Yes | The user's TMDB password. |\n| `request_token` | String | Yes | The request
        token returned by the Create Request Token endpoint. |\n\n# Browser approval vs. `validate_with_login`\n\nBoth methods
        validate a request token before it is exchanged for a session ID.\n\n| Browser approval | `validate_with_login` |\n\
        | --- | --- |\n| User approves the request token on the TMDB website. | User submits TMDB username and password directly
        to the API. |\n| No user credentials pass through your application. | User credentials are included in the request
        body. |\n| May redirect the user to TMDB. | Validation occurs entirely through the API. |\n| Returns a validated request
        token. | Returns a validated request token. |\n\nBoth approaches produce the same result: a validated request token
        that can be used to create a session.\n\n<img src=\"https://content.pstmn.io/2e4d2b45-5e23-4878-a598-03ee86dbff78/QXV0aGVudGljYXRpb24gd29ya2Zsb3cgLSB2aXN1YWwgc2VsZWN0aW9uICgxKS5wbmc=\"\
        \ width=\"579\" height=\"272\">\n\n# Example request\n\n```\nPOST {{base_url}}/authentication/token/validate_with_login\n\
        \n ```\n\n```\n{\n  \"username\": \"your_username\",\n  \"password\": \"your_password\",\n  \"request_token\": \"\
        {{request_token}}\"\n}\n\n ```\n\n# Example success response\n\n``` json\n{\n  \"success\": true,\n  \"expires_at\"\
        : \"2026-06-15 16:12:45 UTC\",\n  \"request_token\": \"{{request_token}}\"\n}\n\n ```\n\n# Response fields\n\n| Field
        | Description |\n| --- | --- |\n| `success` | Indicates whether the request token was successfully validated. |\n\
        | `expires_at` | The expiration date and time of the validated request token. |\n| `request_token` | The validated
        request token that can be exchanged for a session ID. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description**
        | Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{
        \"success\": false, \"status_code\": 30, \"status_message\": \"Invalid username and/or password.\" }` | \\* Incorrect
        TMDB username.  <br>\\* Incorrect TMDB password.  <br>\\ * Expired request token.  <br>\\ * Request token has already
        been used or is invalid. | \\* Verify the user's TMDB credentials.  <br>\\* Generate a new request token if the existing
        one has expired.  <br>\\* Retry the validation request before creating a session. |\n\n# Common use cases\n\n- Validate
        a request token without redirecting users to the TMDB website.\n    \n- Support server-side authentication workflows.\n\
        \    \n- Authenticate users before creating a session.\n    \n- Prepare a validated request token for the **Create
        Session** endpoint.\n    \n\n# Note\n\n- This endpoint **does not create a session ID**.\n    \n- A successfully validated
        request token must be passed to the **Create Session** endpoint to obtain a `session_id`.\n    \n- If the request
        token expires before a session is created, generate a new token and repeat the validation process.\n    \n- Once a
        request token has been successfully exchanged for a session, it cannot be reused."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                request_token:
                  type: string
              required:
                - username
                - password
                - request_token
            example:
              username: YOUR_USERNAME
              password: YOUR_PASSWORD
              request_token: '{{request_token}}'
        required: true
      operationId: createSessionWithLogin
  /account:
    get:
      summary: Account Details
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          example: '{{session_id}}'
          required: true
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
              example:
                avatar: {}
                id: 12345678
                iso_639_1: en
                iso_3166_1: US
                name: John Doe
                username: johndoe
        '403':
          description: Forbidden
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Returns account metadata, including the account identifier required by many account-specific requests.\n\
        \n> **Note**: Before calling this endpoint, you need a valid `session_id` that has not already expired. The session_id
        must be generated through the TMDB authentication workflow. Requests made with an invalid or expired session ID will
        return an authentication error. \n  \n\n### Example request\n\n#### cURL\n\n``` bash\ncurl --request GET \\\n  --url
        \"https://api.themoviedb.org/3/account?api_key=YOUR_API_KEY&session_id=YOUR_SESSION_ID\"\n\n ```\n\n#### Request body\n\
        \n``` json\n{\n  \"session_id\": \"{{session_id}}\"\n}\n\n ```\n\n#### Response\n\n``` json\n{  \"avatar\": {},  \n\
        \"id\": 12345678,  \n\"iso_639_1\": \"en\", \n\"iso_3166_1\": \"US\",  \n\"name\": \"John Doe\", \n\"username\": \"\
        johndoe\"}\n\n ```\n\n### Response field\n\n| Field | Description |\n| --- | --- |\n| id | Unique account identifier
        used in account endpoints. |\n| username | Account username. |\n| name | Display name associated with the account.
        |\n| iso_639_1 | Preferred language code. |\n| iso_3166_1 | Preferred country code. |\n\n## Endpoint-specific error\n\
        \n| **Error status** | **Description** | Example response | **Possible causes** | Solution |\n| --- | --- | --- |
        --- | --- |\n| 403 | Forbidden | Unexpected HTML Response | \\* Missing or invalid session_id.  <br>\\* Missing API
        key or Bearer token.  <br>\\* Incorrect request URL.  <br>\\* Temporary CloudFront or routing issue. | \\* Verify
        that the session_id is valid and has not expired.  <br>\\ * Confirm that the request includes the required authentication.\
        \  <br>\\* Ensure the request is sent to:  <br>GET /3/account  <br>\\* Retry the request if the issue is caused by
        a temporary service interruption. |\n\n> **Note**: Alternatively, you can run this link ([https://api.themoviedb.org/3/account?api_key=YOUR_API_KEY&amp;session_id=YOUR_SESSION_ID)](https://api.themoviedb.org/3/account?api_key=YOUR_API_KEY&session_id=YOUR_SESSION_ID)
        in your web browser; only fill out your actual API Key and Session ID. \n  \n\n### Common use cases\n\n- Retrieve
        the authenticated user's TMDB `account_id` required for subsequent account-related API requests.\n    \n- Confirm
        that the authentication workflow has successfully established access to the user's account.\n    \n- Use the returned
        account information when working with endpoints such as Favorites, Watchlists, Ratings, and Account Details.\n   \
        \ \n\nNow that you have gotten the necessary IDs and tokens, let's proceed to other endpoints where we will use them."
      operationId: getAccountDetails
  /account/{account_id}:
