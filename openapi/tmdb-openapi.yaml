        - name: with_status
          in: query
          description: 'Possible values: 0, 1, 2, 3, 4, or 5. Can be comma (`AND`) or pipe (`OR`) separated.'
          schema:
            type: string
        - name: with_watch_monetization_types
          in: query
          description: 'Possible values: flatrate, free, ads, rent, or buy. Use with `watch_region`.'
          schema:
            type: string
        - name: with_watch_providers
          in: query
          schema:
            type: string
        - name: without_companies
          in: query
