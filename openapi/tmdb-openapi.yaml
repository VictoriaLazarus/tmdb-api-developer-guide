        suggested.\",\n        \"order\": 2\n      },\n      {\n        \"certification\": \"PG-13\",\n        \"meaning\"\
        : \"Parents strongly cautioned.\",\n        \"order\": 3\n      }\n    ]\n  }\n}\n\n ```\n\n# Response fields\n\n\
        | Field | Description |\n| --- | --- |\n| `certifications` | Object containing movie certifications grouped by country.
        |\n| `certifications.` | Array of certification ratings for a specific country or region. |\n| `certification` | Official
        certification value (for example, `PG`, `PG-13`, or `R`). |\n| `meaning` | Description of the certification. |\n|
        `order` | Relative position of the certification within that country's rating system. |\n\n## Endpoint-specific error\n\
        \n| **Error status** | **Description** | Example Response | **Possible causes** | Solution |\n| --- | --- | --- |
        --- | --- |\n| 401 | Unauthorized | `{ \"success\": false, \"status_code\": 7, \"status_message\": \"Invalid API key:
        You must be granted a valid key.\" }` | \\* Missing or invalid Bearer token.  <br>\\* Invalid or revoked API key.\
        \  <br>\\* Incorrectly formatted Authorization header. | \\* Verify that a valid Bearer token or API key is included
        in the request and that the authentication credentials have not expired or been revoked. |\n\n# Common use cases\n\
        \n- Display movie age ratings in an application.\n    \n- Filter movie results by certification using the **Discover
        Movies** endpoint.\n    \n- Build parental control or age-restriction features.\n    \n- Interpret certification values
        returned by movie-related endpoints.\n    \n- Configure region-specific content filtering.\n    \n\n# Note\n\n- This
        endpoint does not require a `movie_id`.\n    \n- Certification ratings are grouped by ISO 3166-1 country codes (for
        example, `US`, `GB`, `DE`, and `FR`).\n    \n- Certification systems vary by country, so the available ratings differ
        between regions.\n    \n- The returned certification values can be used with endpoints such as **Discover Movies**
        to filter content based on regional age ratings.\n    \n\nTip: This endpoint returns the available movie certification
        systems used by each country—it does not return the certification assigned to a specific movie.\n\nFor example:\n\n\
        - Calling this endpoint tells you that the United States uses certifications such as **G**, **PG**, **PG-13**, and
        **R**.\n    \n- To retrieve the certification assigned to a particular movie, use the **Movie Release Dates** endpoint,
        which returns country-specific release information along with the movie's certification."
      operationId: getMovieCertifications
  /certification/tv/list:
    get:
      summary: TV Certifications
      parameters: []
      responses:
        '200':
          description: TV Certifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationListResponse'
              example:
                certifications:
                  US:
                    - certification: TV-Y
                      meaning: This program is designed to be appropriate for all children.
                      order: 1
                    - certification: TV-Y7
                      meaning: This program is designed for children age 7 and above.
                      order: 2
                    - certification: TV-G
                      meaning: Most parents would find this program suitable for all ages.
                      order: 3
      tags:
        - Certifications
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "The **TV Certifications** endpoint retrieves an up-to-date list of officially supported TV show certifications
        on TMDB.\n\n## Prerequisites\n\nBefore calling this endpoint, ensure that you have:\n\n1. The `base_url` environment
        variable configured correctly.\n    \n2. The Authorization header configured with your valid Bearer token.\n    \n\
        \n### Example request\n\n``` text\nGET {{base_url}}/certification/tv/list\n\n ```\n\n## Response\n\nA successful request
        returns a `200 OK` response containing a `certifications` object.\n\nThe `certifications` object is organized by country
        or region code. Each country contains an array of certification objects.\n\n### Response fields\n\n| Field | Type
        | Description |\n| --- | --- | --- |\n| `certifications` | Object | Contains TV certification lists grouped by country
        or region code. |\n| `certifications.{country_code}` | Array | Contains the certifications supported in the specified
        country or region. |\n| `certification` | String | The certification or rating code. |\n| `meaning` | String | Describes
        what the certification means. |\n| `order` | Integer | Indicates the certification's order within the country's rating
        system. |\n\n### Example response structure\n\n``` json\n{\n  \"certifications\": {\n    \"US\": [\n      {\n    \
        \    \"certification\": \"TV-Y\",\n        \"meaning\": \"This program is designed to be appropriate for all children.\"\
        ,\n        \"order\": 1\n      },\n      {\n        \"certification\": \"TV-Y7\",\n        \"meaning\": \"This program
        is designed for children age 7 and above.\",\n        \"order\": 2\n      },\n      {\n        \"certification\":
        \"TV-G\",\n        \"meaning\": \"Most parents would find this program suitable for all ages.\",\n        \"order\"\
        : 3\n      }\n    ]\n  }\n}\n\n ```\n\n**Note:** The endpoint returns certification data for multiple countries and
        regions. The available certification codes and their meanings vary by country.\n\n## Common use case\n\nUse this endpoint
        when your application needs to:\n\n- Display available TV content ratings.\n    \n- Build a TV certification or parental-control
        filter.\n    \n- Map TMDB TV certification codes to user-facing descriptions.\n    \n- Retrieve the rating systems
        supported for different countries or regions.\n    \n\n## Notes\n\n- The endpoint returns certification information
        rather than individual TV shows.\n    \n- Certification data is grouped by country or region.\n    \n- The certification
        list may be updated as TMDB updates its supported rating systems."
      operationId: getTVCertifications
  /search/collection:
