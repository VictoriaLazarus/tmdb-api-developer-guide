  /movie/{movie_id}/translations:
    get:
      tags:
      - Movies
      summary: Translations
      description: |-
        Retrieves all available translations for a specific movie.

        ## Common use cases

        - Build multilingual applications.
        - Display localized movie titles and descriptions.
        - Support users across different countries and languages.
        - Populate language selectors in applications.
        - Manage localized movie metadata.

        ## Understanding language and region codes

        Each translation is identified by both a language and region code.

        | Field | Example | Description |
        | --- | --- | --- |
        | `iso_639_1` | `en` | ISO 639-1 language code. |
        | `iso_3166_1` | `US` | ISO 3166-1 country or region code. |

        Examples:

        | Locale | Description |
        | --- | --- |
        | `en-US` | English (United States) |
        | `en-GB` | English (United Kingdom) |
        | `fr-FR` | French (France) |
        | `es-ES` | Spanish (Spain) |

        Although two locales may share the same language, their localized content can differ based on regional conventions.

        ## Translation availability

        A movie may have multiple translations available, each representing a different language or regional variation.

        Some translations include:

        - Localized titles,
        - Translated overviews,
        - Localized taglines,
        - Localized homepage URLs.

        Others may contain only a subset of these fields. Applications should not assume that every translation contains complete metadata.

        ## Translations vs. `language` query parameter

        Although both approaches support localization, they serve different purposes.

        For example:

        ```http
        GET /movie/550/translations
        ```

        returns every available translation.

        Whereas:

        ```http
        GET /movie/550?language=fr-FR
        ```

        returns the movie details only in French (if available).

        Tip: Use this endpoint to **discover which translations are available** for a movie. Once you've identified the language you need, you can request the **Movie Details** endpoint with the corresponding `language` query parameter to retrieve a localized version of the movie metadata.
