      description: "Searches TMDB movies using their original, translated, or alternative titles.\n\n### Query parameters\n\
        \n| Parameter | Required | Description | Example |\n| --- | --- | --- | --- |\n| `query` | Yes | The movie title or
        keyword to search for. | `Inception` |\n| `language` | No | Specifies the language of the returned results. | `en-US`
        |\n| `page` | No | Returns a specific page of search results. | `1` |\n| `include_adult` | No | Determines whether
        adult content is included in the results. | `false` |\n| `year` | No | Filters results by release year. | `2010` |\n\
        | `primary_release_year` | No | Filters results by the movie's primary release year. | `2010` |\n| `region` | No |
        Filters results based on a specific country or region. | `US` |\n\n### Example request\n\n```\n{{base_url}}/search/movie?query=Inception&language=en-US&page=1&include_adult=false\n\
        \n ```\n\n## Example success response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 27205,\n\
        \      \"title\": \"Inception\",\n      \"release_date\": \"2010-07-15\",\n      \"overview\": \"A skilled thief is
        given a chance at redemption...\",\n      \"vote_average\": 8.4,\n      \"popularity\": 102.5\n    }\n  ],\n  \"total_pages\"\
        : 1,\n  \"total_results\": 1\n}\n\n ```\n\n## Response field\n\n| Field | Type | Description |\n| --- | --- | ---
        |\n| `page` | Integer | The current page of search results. |\n| `results` | Array | An array containing movies that
        match the search query. |\n| `results[].id` | Integer | The unique TMDB identifier of the movie. |\n| `results[].title`
        | String | The movie's title. |\n| `results[].release_date` | String | The movie's release date, formatted as `YYYY-MM-DD`.
        |\n| `results[].overview` | String | A brief description or synopsis of the movie. |\n| `results[].vote_average` |
        Number | The average rating given to the movie by TMDB users. |\n| `results[].popularity` | Number | TMDB's popularity
        score for the movie. |\n| `total_pages` | Integer | The total number of pages available for the search results. |\n\
        | `total_results` | Integer | The total number of movies matching the search query. |\n\nNote: In this example, TMDB
        found one matching movie, _Inception_, with a TMDB movie ID of `27205`.\n\n## Endpoint-specific error\n\n| **Error
        status** | **Description** | Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n\
        | 400 | Bad Request | `{ \"success\": false, \"status_code\": 22, \"status_message\": \"Invalid parameter: query must
        be provided.\" }` | \\* The query parameter is missing.  <br>\\* The query parameter is empty.  <br>\\* The request
        contains an invalid query value. | Provide a valid movie title or keyword in the query parameter and retry the request.
        |\n\n## Common use cases\n\n- Search for movies by title.\n    \n- Build search and autocomplete functionality.\n\
        \    \n- Retrieve a movie's TMDB ID for use with Movie endpoints.\n    \n- Filter search results by release year,
        language, or region.\n    \n- Allow users to quickly locate movies within an application.\n    \n\n## Note\n\n- Results
        are returned in a paginated format and support the `page` query parameter.\n    \n- Optional parameters such as `language`,
        `region`, `year`, `primary_release_year`, and `include_adult` can be used to refine search results.\n    \n- Each
        movie includes a unique TMDB ID that can be used with Movie endpoints to retrieve detailed information.\n    \n\n\
        **Important:** The `release_date` field may be empty when TMDB does not have a release date for a movie. Similarly,
        some metadata may vary depending on the information available for the movie and the language or region specified in
        the request."
