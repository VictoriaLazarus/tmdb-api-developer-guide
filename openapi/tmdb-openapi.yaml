        - name: without_genres
          in: query
          schema:
            type: string
        - name: without_keywords
          in: query
          schema:
            type: string
        - name: without_watch_providers
          in: query
          schema:
            type: string
        - name: with_type
          in: query
          description: 'Possible values: 0, 1, 2, 3, 4, 5, or 6. Can be comma (`AND`) or pipe (`OR`) separated.'
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscoverTVResponse'
              example:
                page: 1
                results:
                  - adult: false
                    backdrop_path: /xUB3xFMgsHgPmdWnUWkHTJ03vHa.jpg
                    genre_ids:
                      - 10759
                      - 10765
                      - 18
                      - 10751
                    id: 82452
                    origin_country:
                      - US
                    original_language: en
                    original_name: 'Avatar: The Last Airbender'
                    overview: A young boy known as the Avatar must master the four elemental powers to save a world at 
                      war...
                    popularity: 169.5136
                    poster_path: /lzZpWEaqzP0qVA5nkCc5ASbNcSy.jpg
                    first_air_date: '2024-02-22'
                    name: 'Avatar: The Last Airbender'
                    vote_average: 7.789
                    vote_count: 1255
                total_pages: 148
                total_results: 2951
      tags:
        - Discover
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Discovers TV shows by applying one or more filtering and sorting criteria instead of a search query.\n\
        \n> **Note**: This endpoint retrieves public TMDB data and does not require a `session_id` or `account_id`. \n  \n\
        \n# Query parameters\n\n| Parameter | Description | Example |\n| --- | --- | --- |\n| `language` | Specifies the language
        of the returned results. | `en-US` |\n| `sort_by` | Sorts the results using a supported sort option. | `popularity.desc`
        |\n| `page` | Returns a specific page of results. | `1` |\n| `with_genres` | Filters TV shows by one or more genre
        IDs. | `18,10765` |\n| `first_air_date_year` | Filters TV shows by the year they first aired. | `2024` |\n| `vote_average.gte`
        | Returns TV shows with at least the specified average rating. | `8` |\n| `vote_count.gte` | Returns TV shows with
        at least the specified number of votes. | `100` |\n| `with_original_language` | Filters TV shows by their original
        language. | `en` |\n| `with_watch_providers` | Filters TV shows available on specific streaming providers. | `8` |\n\
        | `watch_region` | Specifies the country used for watch provider filtering. | `US` |\n\n## Request example\n\n```\n\
        GET {{base_url}}/discover/tv?with_genres=18&first_air_date_year=2024&sort_by=popularity.desc\n\n ```\n\n# Example
        response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"adult\": false,\n      \"backdrop_path\"\
        : \"/xUB3xFMgsHgPmdWnUWkHTJ03vHa.jpg\",\n      \"genre_ids\": [10759, 10765, 18, 10751],\n      \"id\": 82452,\n \
        \     \"origin_country\": [\"US\"],\n      \"original_language\": \"en\",\n      \"original_name\": \"Avatar: The
        Last Airbender\",\n      \"overview\": \"A young boy known as the Avatar must master the four elemental powers to
        save a world at war...\",\n      \"popularity\": 169.5136,\n      \"poster_path\": \"/lzZpWEaqzP0qVA5nkCc5ASbNcSy.jpg\"\
        ,\n      \"first_air_date\": \"2024-02-22\",\n      \n      \"name\": \"Avatar: The Last Airbender\"\
        ,\n      \"vote_average\": 7.789,\n      \"vote_count\": 1255\n    }\n  ],\n  \"total_pages\": 148,\n  \"total_results\"\
        : 2951\n}\n\n ```\n\n# Response field\n\n| Field | Type | Description |\n| --- | --- | --- |\n| `page` | Integer |
        The current page number. |\n| `results` | Array | Contains TV shows that match the specified filters. |\n| `results[].adult`
        | Boolean | Indicates whether the TV show is classified as adult content. |\n| `results[].backdrop_path` | String
        / null | The relative path to the TV show's backdrop image. |\n| `results[].genre_ids` | Array | Contains the TMDB
        genre IDs associated with the TV show. |\n| `results[].id` | Integer | The unique TMDB ID of the TV show. |\n| `results[].origin_country`
        | Array | Contains the country codes associated with the TV show's origin. |\n| `results[].original_language` | String
        | The original language of the TV show. |\n| `results[].original_name` | String | The original name of the TV show.
        |\n| `results[].overview` | String | A brief description of the TV show. |\n| `results[].popularity` | Number | The
        TV show's popularity score on TMDB. |\n| `results[].poster_path` | String / null | The relative path to the TV show's
        poster image. |\n| `results[].first_air_date` | String | The date the TV show first aired, in `YYYY-MM-DD` format.
        |\n| `results[].name`
        | String | The name of the TV show. |\n| `results[].vote_average` | Number | The average user rating for the TV show.
        |\n| `results[].vote_count` | Integer | The number of votes received by the TV show. |\n| `total_pages` | Integer
        | The total number of pages available. |\n| `total_results` | Integer | The total number of TV shows matching the
        specified filters. |\n\n# TV-specific filtering\n\nThe Discover TV endpoint shares many filtering options with **Discover
        Movies**, but it also includes parameters specific to television content.\n\n| Discover Movies | Discover TV |\n|
        --- | --- |\n| `primary_release_year` | `first_air_date_year` |\n| `primary_release_date.gte` | `first_air_date.gte`
        |\n| `primary_release_date.lte` | `first_air_date.lte` |\n\nUse `first_air_date_year` when you want to retrieve TV
        shows that premiered during a specific year.\n\nFor example:\n\n```\nGET {{base_url}}/discover/tv?first_air_date_year=2024\n\
        \n ```\n\nThis request returns TV shows whose first episode aired in **2024**.\n\n# AND / OR Filter Logic\n\nSeveral
        filtering parameters support combining multiple values using commas (`,`) or pipes (`|`).\n\n| Separator | Behavior
        | Example |\n| --- | --- | --- |\n| `,` | **AND** — results must satisfy all specified values. | `with_genres=18,10765`
        |\n| \\` | \\` | **OR** — results may satisfy any specified value. |\n\nFor example:\n\n- `with_genres=18,10765` returns
        TV shows that are both **Drama** and **Sci-Fi & Fantasy**.\n    \n- `with_genres=18|10765` returns TV shows that are
        **Drama** or **Sci-Fi & Fantasy**.\n    \n\n# Common use cases\n\n- Build **Browse TV Shows** pages.\n    \n- Recommend
        TV series based on genres or ratings.\n    \n- Filter TV shows by language, streaming provider, or first air date.\n\
        \    \n- Display popular, top-rated, or recently premiered TV series.\n    \n- Create advanced filtering experiences
        for television content.\n    \n\n# Note\n\n- Does not require a search query (`query`).\n    \n- Supports advanced
        filtering and sorting through multiple query parameters.\n    \n- Returns results in a paginated format.\n    \n-
        Multiple filters can be combined to create highly specific discovery queries.\n    \n- Each TV show includes a unique
        TMDB TV series ID that can be used with the TV collection to retrieve additional information.\n    \n\n**Note:** The
        Discover TV endpoint supports many of the same filtering and sorting options as **Discover Movies**. However, TV-specific
        parameters such as `first_air_date_year`, `first_air_date.gte`, and `first_air_date.lte` replace the movie-specific
        release date parameters. Use the endpoint that corresponds to the type of media you want to discover."
      operationId: discoverTV
  /movie/{movie_id}:
    get:
      summary: Movie Details
      parameters:
        - name: append_to_response
          in: query
          description: Comma-separated list of endpoints within this namespace, up to 20 items.
          schema:
            type: string
          example: credits,videos
        - name: language
          in: query
          schema:
            type: string
            default: en-US
          example: en-US
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetails'
              example:
                id: 550
                title: Fight Club
                overview: A depressed office worker forms an underground fight club...
                release_date: '1999-10-15'
                runtime: 139
                genres:
                  - id: 18
                    name: Drama
                vote_average: 8.4
                vote_count: 29000
                popularity: 85.2
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id004
                success: false
                status_code: 34
                status_message: The resource you requested could not be found.
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves detailed information about a specific movie identified by its unique TMDB ID.\n\n# Path parameters\n\
        \n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique
        TMDB identifier of the movie to retrieve. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description |
        Example |\n| --- | --- | --- | --- | --- |\n| `language` | String | No | Specifies the language used for localized
        movie information. | `en-US` |\n| `append_to_response` | String | No | Appends additional supported resources (such
        as `credits`, `videos`, or `images`) to the same response, reducing the number of API requests required. | `credits,videos`
        |\n\n**Note:** The `append_to_response` parameter is optional but can improve performance by retrieving related resources
        in a single request. Also, this endpoint retrieves public movie information and does not require a `session_id` or
        `account_id`.\n\n# Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}?language=en-US\n\n ```\n\n# Example
        success response\n\n``` json\n{\n  \"id\": 550,\n  \"title\": \"Fight Club\",\n  \"overview\": \"A depressed office
        worker forms an underground fight club...\",\n  \"release_date\": \"1999-10-15\",\n  \"runtime\": 139,\n  \"genres\"\
        : [\n    {\n      \"id\": 18,\n      \"name\": \"Drama\"\n    }\n  ],\n  \"vote_average\": 8.4,\n  \"vote_count\"\
        : 29000,\n  \"popularity\": 85.2\n}\n\n ```\n\n## Response field\n\n| Field | Type | Description |\n| --- | --- |
        --- |\n| `id` | Integer | The unique TMDB ID of the movie. |\n| `title` | String | The title of the movie. |\n| `overview`
        | String | A brief description or synopsis of the movie. |\n| `release_date` | String | The movie's release date in
        `YYYY-MM-DD` format. |\n| `runtime` | Integer | The movie's runtime in minutes. |\n| `genres` | Array | Contains the
        genres associated with the movie. |\n| `genres[].id` | Integer | The unique TMDB ID of the genre. |\n| `genres[].name`
        | String | The name of the genre. |\n| `vote_average` | Number | The average user rating for the movie. |\n| `vote_count`
        | Integer | The number of votes received by the movie. |\n| `popularity` | Number | The movie's popularity score on
        TMDB. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes**
        | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"\
        status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.\
        \  <br>\\* The movie_id is invalid or incorrectly formatted.  <br>\\* The requested resource has been removed or is
        unavailable. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies endpoint to retrieve a valid
        movie ID before making the request.  <br>\\* Ensure the path parameter is an integer. |\n\n# Common use cases\n\n\
        - Display detailed information about a movie.\n    \n- Retrieve metadata for a movie details page.\n    \n- Obtain
        production companies, genres, runtime, and release information.\n    \n- Retrieve localized movie information using
        the `language` parameter.\n    \n- Fetch related resources using the `append_to_response` parameter.\n    \n\nNote:
        This endpoint serves as the primary source of movie metadata and is commonly used to populate movie detail pages.
        The returned `movie_id` can also be used with other Movie endpoints to retrieve related resources such as credits,
        images, videos, reviews, recommendations, release dates, keywords, and watch providers"
      operationId: getMovieDetails
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/account_states:
    get:
      summary: Account States
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          example: '{{session_id}}'
          required: false
          description: User session identifier. Provide either session_id or guest_session_id.
        - name: guest_session_id
          in: query
          schema:
            type: string
          example: '{{guest_session_id}}'
          required: false
          description: Guest session identifier. Provide either guest_session_id or session_id.
      responses:
        '200':
          description: Account States
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieAccountStates'
              example:
                id: 550
                favorite: true
                watchlist: false
                rated:
                  value: 8.5
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the authenticated user's account-specific state for a particular movie.\n\nNote: An account
        state represents the authenticated user's relationship with a specific movie. It indicates whether the user has marked
        the movie as a favorite, added it to a watchlist, or submitted a personal rating. Unlike public movie metadata, these
        values are unique to each authenticated user.\n\n## Prerequisite\n\nThis endpoint requires:\n\n- A valid `movie_id`.\n\
        \    \n- A valid authenticated `session_id`.\n    \n- A valid Bearer token.\n    \n\nRequests made without a valid
        authenticated session return an authentication error.\n\n## Path parameters\n\n| Parameter | Type | Required | Description
        |\n| --- | --- | --- | --- |\n| movie_id | Integer | Yes | The unique identifier of the movie. |\n\n## Query Parameters\n\
        \n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| session_id | String | Yes | The authenticated
        user's session identifier. |\n\n## Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/account_states?session_id={{session_id}}\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"id\": 550,\n  \"favorite\": true,\n  \"watchlist\": false,\n\
        \  \"rated\": {\n    \"value\": 8.5\n  }\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n\
        | `favorite` | Indicates whether the authenticated user has marked the movie as a favorite. |\n| `watchlist` | Indicates
        whether the movie is in the user's watchlist. |\n| `rated` | Indicates whether the user has rated the movie. If a
        rating exists, the rating value is returned. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description**
        | Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{
        \"success\": false, \"status_code\": 3, \"status_message\": \"Authentication failed: You do not have permissions to
        access the service.\" }` | \\* The session_id is missing.  <br>\\* The session_id is invalid or has expired.  <br>\\
        * The Bearer token is missing or invalid.  <br>\\* The request was made without an authenticated user session. | \\
        * Ensure a valid Bearer token is included in the Authorization header.  <br>\\* Verify that the session_id was created
        successfully and has not expired.  <br>\\* Confirm that the session_id belongs to the authenticated user.  <br>\\\
        * Retry the request after correcting the authentication credentials. |\n| 404 | Not found | `{ \"success\": false,
        \"status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified
        movie_id does not exist.  <br>\\* An invalid movie_id was supplied. | \\* Verify that the movie_id is correct, or
        use the Search Movies endpoint to obtain a valid movie ID before retrying the request. |\n\n# Common use cases\n\n\
        - Display whether a movie has been added to the user's watchlist.\n    \n- Show whether the movie is marked as a favorite.\n\
        \    \n- Display the user's existing rating for the movie.\n    \n- Personalize a movie details page based on the
        authenticated user's interactions.\n    \n- Determine whether rating or watchlist actions should be displayed in the
        UI."
      operationId: getMovieAccountStates
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
