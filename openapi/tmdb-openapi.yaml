  /movie/{movie_id}/videos:
    get:
      tags:
      - Movies
      summary: Videos
      description: |-
        Retrieves video assets associated with a movie, including trailers, teasers, featurettes, clips, and behind-the-scenes content.

        ## Common use cases

        - Displaying movie trailers
        - Embedding promotional videos
        - Building media galleries
        - Enhancing movie detail pages
        - Supporting content discovery and marketing features

        ## Video types

        The `type` field may contain values such as:

        | Type | Description |
        | --- | --- |
        | Trailer | Official movie trailer |
        | Teaser | Promotional teaser video |
        | Featurette | Short feature or promotional segment |
        | Clip | Excerpt from the movie |
        | Behind the Scenes | Production footage and interviews |
        | Bloopers | Outtakes and humorous moments |

        ## Difference between Videos and Images

        ### Videos

        - Trailers
        - Teasers
        - Featurettes
        - Clips
        - Behind-the-scenes footage

        ### Images

        - Posters
        - Backdrops
        - Logos

        Use the **Videos** endpoint for promotional and multimedia content, and the **Images** endpoint for visual assets.

        ## Notes

        The endpoint returns metadata about videos, not the video files themselves. Applications can use the returned `key` and `site` values to construct links or embedded players for supported platforms uch as YouTube and Vimeo.

        For example, when:

