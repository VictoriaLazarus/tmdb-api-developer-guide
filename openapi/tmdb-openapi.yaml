                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the alternative titles associated with a specific movie.\n\n# Path parameters\n\n| Parameter
        | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier
        of the movie. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description | Example |\n| --- | --- | ---
        | --- | --- |\n| `country` | String | No | Filters alternative titles by a specific ISO 3166-1 country code. | `US`
        |\n\n**Note:** If the `country` parameter is omitted, the endpoint returns alternative titles from all available countries.\n\
        \n# Example request\n\nRetrieve all alternative titles:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/alternative_titles\n\
        \n ```\n\nRetrieve alternative titles for a specific country:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/alternative_titles?country=US\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"id\": 550,\n  \"titles\": [\n    {\n      \"iso_3166_1\"\
        : \"US\",\n      \"title\": \"Fight Club\",\n      \"type\": \"\"\n    },\n    {\n      \"iso_3166_1\": \"FR\",\n\
        \      \"title\": \"Fight Club\",\n      \"type\": \"Titre français\"\n    }\n  ]\n}\n\n ```\n\n## Response field\n\
        \n| Field | Type | Description |\n| --- | --- | --- |\n| `id` | Integer | The unique TMDB ID of the movie. |\n| `titles`
        | Array | Contains the alternative titles associated with the movie. |\n| `titles[].iso_3166_1` | String | The ISO
        3166-1 country code identifying the country or region associated with the title. |\n| `titles[].title` | String |
        The alternative title of the movie. |\n| `titles[].type` | String | Describes the type or language-specific designation
        of the alternative title. This field may be empty. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description**
        | Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"\
        success\": false, \"status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` |
        \\* The specified movie_id does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify
        that the movie_id is correct.  <br>\\ * Use the Search Movies endpoint to retrieve a valid movie ID before making
        the request. |\n\n# Common use cases\n\n- Display localized movie titles based on a user's country.\n    \n- Support
        international and multilingual applications.\n    \n- Show region-specific release titles.\n    \n- Improve search
        functionality by matching localized or alternative movie names.\n    \n- Build applications that present movie information
        for global audiences.\n    \n\nNote: This endpoint helps developers display movie titles appropriate for different
        audiences and supports applications that need to search for or present movies using localized naming conventions."
      operationId: getMovieAlternativeTitles
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/changes:
    get:
      summary: Changes
      parameters:
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          example: '2025-01-31'
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          example: '2025-01-01'
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieChangesResponse'
              example:
                changes:
                  - key: overview
                    items:
                      - id: 64b1f5...
                        action: updated
                        time: 2026-01-15 10:30:00 UTC
                  - key: title
                    items:
                      - id: 64b1f6...
                        action: updated
                        time: 2026-01-15 10:35:00 UTC
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the change history for a specific movie, including updates made to its metadata within an optional
        date range.\n\n# Path parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id`
        | Integer | Yes | The unique TMDB identifier of the movie. |\n\n# Query parameters\n\n| Parameter | Type | Required
        | Description | Example |\n| --- | --- | --- | --- | --- |\n| `start_date` | String | No | Returns changes made on
        or after the specified date (`YYYY-MM-DD`). | `2026-01-01` |\n| `end_date` | String | No | Returns changes made on
        or before the specified date (`YYYY-MM-DD`). | `2026-01-31` |\n| `page` | Integer | No | Returns a specific page of
        results. | `1` |\n\n**Note:** If no date range is specified, TMDB returns recent changes based on its default behavior.\n\
        \n# Example request\n\nRetrieve all recent changes:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/changes\n\n ```\n\n\
        Retrieve changes within a date range:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/changes?start_date=2026-01-01&end_date=2026-01-31\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"changes\": [\n    {\n      \"key\": \"overview\",\n     \
        \ \"items\": [\n        {\n          \"id\": \"64b1f5...\",\n          \"action\": \"updated\",\n          \"time\"\
        : \"2026-01-15 10:30:00 UTC\"\n        }\n      ]\n    },\n    {\n      \"key\": \"title\",\n      \"items\": [\n\
        \        {\n          \"id\": \"64b1f6...\",\n          \"action\": \"updated\",\n          \"time\": \"2026-01-15
        10:35:00 UTC\"\n        }\n      ]\n    }\n  ]\n}\n\n ```\n\n## Response fields\n\n| Field | Type | Description |\n\
        | --- | --- | --- |\n| `changes` | Array | Contains the changes made to the movie. |\n| `changes[].key` | String |
        Identifies the movie field that was changed, such as `overview` or `title`. |\n| `changes[].items` | Array | Contains
        details about each change made to the specified field. |\n| `changes[].items[].id` | String | The unique identifier
        for the change record. |\n| `changes[].items[].action` | String | Describes the action performed on the field, such
        as `updated`. |\n| `changes[].items[].time` | String | The date and time when the change occurred, including the UTC
        time zone. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible
        causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\"\
        : 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id does
        not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct. \
        \ <br>\\ * Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use
        cases\n\n- Synchronize a local movie database with TMDB.\n    \n- Detect recently updated movie information.\n   \
        \ \n- Refresh cached movie metadata.\n    \n- Monitor changes to movie records over time.\n    \n- Build automated
        content synchronization workflows."
      operationId: getMovieChanges
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/credits:
    get:
      summary: Credits
      responses:
        '200':
          description: Credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieCreditsResponse'
              example:
                id: 550
                cast:
                  - id: 287
                    name: Brad Pitt
                    character: Tyler Durden
                    order: 1
                    profile_path: /kU3B75TyRiCgE270EyZnHjfivoq.jpg
                crew:
                  - id: 7467
                    name: David Fincher
                    department: Directing
                    job: Director
                    profile_path: /tpEczFclQZeKAiCVEY3qZ3c3PXp.jpg
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the cast and crew members associated with a specific movie.\n\n# Path parameters\n\n| Parameter
        | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier
        of the movie. |\n\n# Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/credits\n\n ```\n\nThis request returns
        the cast and crew information for **Fight Club**.\n\n# Response structure\n\nThe response is divided into two primary
        arrays: **cast**, which contains actors and the characters they portray, and **crew**, which contains the production
        personnel responsible for creating the movie, such as directors, producers, writers, editors, composers, and other
        contributors.\n\n## `cast`\n\nThe `cast` array contains people who appear in the movie.\n\n| Field | Description |\n\
        | --- | --- |\n| `id` | Unique TMDB identifier of the person. |\n| `name` | Name of the cast member. |\n| `character`
        | Character portrayed in the movie. |\n| `order` | Billing order in the cast list. |\n| `profile_path` | Path to the
        person's profile image. |\n\n### Example\n\n``` json\n{\n  \"id\": 287,\n  \"name\": \"Brad Pitt\",\n  \"character\"\
        : \"Tyler Durden\",\n  \"order\": 1,\n  \"profile_path\": \"/kU3B75TyRiCgE270EyZnHjfivoq.jpg\"\n}\n\n ```\n\n## `crew`\n\
        \nThe `crew` array contains people who contributed behind the scenes during production.\n\n| Field | Description |\n\
        | --- | --- |\n| `id` | Unique TMDB identifier of the crew member. |\n| `name` | Name of the crew member. |\n| `department`
        | Production department (for example, Directing or Writing). |\n| `job` | Specific role performed by the crew member.
        |\n| `profile_path` | Path to the crew member's profile image. |\n\n### Example\n\n``` json\n{\n  \"id\": 7467,\n\
        \  \"name\": \"David Fincher\",\n  \"department\": \"Directing\",\n  \"job\": \"Director\",\n  \"profile_path\": \"\
        /tpEczFclQZeKAiCVEY3qZ3c3PXp.jpg\"\n}\n\n ```\n\n- **Cast** represents people who appear on screen, such as actors
        and actresses.\n    \n- **Crew** represents people who work behind the scenes, such as directors, producers, writers,
        editors, cinematographers, and composers.\n    \n\nTip: Each person returned in the `cast` and `crew` arrays includes
        a unique **person ID** (`id`). You can use this identifier with the **People** collection to retrieve additional information
        about the individual, including their biography, profile images, external IDs, and complete movie and TV credits.\n\
        \n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies
        endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use cases\n\n- Display movie cast lists.\n\
        \    \n- Display directors, producers, writers, and other crew members.\n    \n- Link cast and crew members to their
        profile pages.\n    \n- Build movie credits pages.\n    \n- Support actor, director, and crew search features.\n \
        \   \n- Display filmography information."
      operationId: getMovieCredits
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/images:
    get:
      summary: Images
      parameters:
        - name: include_image_language
          in: query
          description: 'Specify a comma-separated list of ISO-639-1 values to query, for example: en-US,null'
          schema:
            type: string
          example: string
        - name: language
          in: query
          schema:
            type: string
            default: en-US
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieImagesResponse'
              example:
                id: 550
                backdrops:
                  - file_path: /fCayJrkfRaCRCTh8GqN30f8oyQF.jpg
                    width: 1920
                    height: 1080
                    iso_639_1:
                posters:
                  - file_path: /pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
                    width: 1000
                    height: 1500
                    iso_639_1: en
                logos:
                  - file_path: /logo.png
                    width: 500
                    height: 250
                    iso_639_1: en
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the images associated with a specific movie.\n\n# Path parameters\n\n| Parameter | Type | Required
        | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier of the movie.
        |\n\n# Query parameters\n\n| Parameter | Type | Required | Description | Example |\n| --- | --- | --- | --- | ---
        |\n| `language` | String | No | Filters images based on the specified language. | `en-US` |\n| `include_image_language`
        | String | No | Includes images for one or more additional languages. Use a comma-separated list of ISO 639-1 language
        codes. Use `null` to include images without an associated language. | `en,null` |\n\n**Note:** If the `language` parameter
        is specified, TMDB returns images that match that language. Use `include_image_language` to retrieve images in additional
        languages or images that are not associated with any language.\n\n# Example request\n\nRetrieve images using the default
        language:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/images\n\n ```\n\nRetrieve English images and language-independent
        images:\n\n```\nGET {{base_url}}/movie/{{movie_id}}/images?language=en-US&include_image_language=en,null\n\n ```\n\
        \n# Example success response\n\n``` json\n{\n  \"id\": 550,\n  \"backdrops\": [\n    {\n      \"file_path\": \"/fCayJrkfRaCRCTh8GqN30f8oyQF.jpg\"\
        ,\n      \"width\": 1920,\n      \"height\": 1080,\n      \"iso_639_1\": null\n    }\n  ],\n  \"posters\": [\n   \
        \ {\n      \"file_path\": \"/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg\",\n      \"width\": 1000,\n      \"height\": 1500,\n\
        \      \"iso_639_1\": \"en\"\n    }\n  ],\n  \"logos\": [\n    {\n      \"file_path\": \"/logo.png\",\n      \"width\"\
        : 500,\n      \"height\": 250,\n      \"iso_639_1\": \"en\"\n    }\n  ]\n}\n\n ```\n\n# Response structure\n\nThe
        response contains three primary arrays.\n\n## `backdrops`\n\nHigh-resolution background images commonly used as banners
        or hero images.\n\n| Field | Description |\n| --- | --- |\n| `file_path` | Relative path to the image. |\n| `width`
        | Image width in pixels. |\n| `height` | Image height in pixels. |\n| `iso_639_1` | Language associated with the image,
        if available. |\n| `vote_average` | Average community rating for the image. |\n| `vote_count` | Number of votes received.
        |\n\n## `posters`\n\nOfficial promotional posters for the movie.\n\n| Field | Description |\n| --- | --- |\n| `file_path`
        | Relative path to the poster image. |\n| `width` | Image width in pixels. |\n| `height` | Image height in pixels.
        |\n| `iso_639_1` | Language associated with the poster, if available. |\n| `vote_average` | Average community rating
        for the image. |\n| `vote_count` | Number of votes received. |\n\n## `logos`\n\nOfficial movie logos and branding
        assets.\n\n| Field | Description |\n| --- | --- |\n| `file_path` | Relative path to the logo image. |\n| `width` |
        Image width in pixels. |\n| `height` | Image height in pixels. |\n| `iso_639_1` | Language associated with the logo,
        if available. |\n| `vote_average` | Average community rating for the image. |\n| `vote_count` | Number of votes received.
        |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** |
        Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies
        endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use cases\n\n- Display movie posters
        in search results and detail pages.\n    \n- Show backdrop images as banners or hero images.\n    \n- Display localized
        movie logos.\n    \n- Build image galleries for movies.\n    \n- Retrieve assets for marketing or promotional content.\n\
        \    \n- Support multilingual user interfaces.\n    \n\nNote: The `file_path` values returned by this endpoint are
        **relative paths**, not complete image URLs. To display an image, combine the `file_path` with the TMDB image base
        URL and an appropriate image size. For example:\n\n```\nhttps://image.tmdb.org/t/p/w500{{file_path}}\n\n ```\n\nUsing
        different image sizes allows you to optimize image quality and loading performance for various devices and screen
        resolutions."
      operationId: getMovieImages
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/external_ids:
    get:
      summary: External IDs
      responses:
        '200':
          description: External IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieExternalIds'
              example:
                id: 550
                imdb_id: tt0137523
                wikidata_id: Q190908
                facebook_id:
                instagram_id:
                twitter_id:
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the external identifiers associated with a specific movie. These identifiers provide mappings
        between TMDB and third-party platforms, allowing developers to cross-reference movie records across external services
        such as IMDb, Wikidata, Facebook, Instagram, and X (formerly Twitter).\n\n# Path parameters\n\n| Parameter | Type
        | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier of
        the movie. |\n\n# Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/external_ids\n\n ```\n\n# Example success
        response\n\n``` json\n{\n  \"id\": 550,\n  \"imdb_id\": \"tt0137523\",\n  \"wikidata_id\": \"Q190908\",\n  \"facebook_id\"\
        : null,\n  \"instagram_id\": null,\n  \"twitter_id\": null\n}\n\n ```\n\n# Response fields\n\n| Field | Description
        |\n| --- | --- |\n| `id` | The unique TMDB identifier of the movie. |\n| `imdb_id` | The movie's IMDb identifier.
        |\n| `wikidata_id` | The corresponding Wikidata entity identifier. |\n| `facebook_id` | The associated Facebook page
        identifier, if available. |\n| `instagram_id` | The associated Instagram account identifier, if available. |\n| `twitter_id`
        | The associated X (formerly Twitter) account identifier, if available. |\n\nHere is a breakdown of how to use the
        response returned by the endpoint.\n\n| Identifier | Uses |\n| --- | --- |\n| `imdb_id` | Link to the movie's IMDb
        page or match records with IMDb datasets. |\n| `wikidata_id` | Access structured metadata from Wikidata. |\n| `facebook_id`
        | Link to the movie's official Facebook page, if available. |\n| `instagram_id` | Link to the movie's official Instagram
        account, if available. |\n| `twitter_id` | Link to the movie's official X (formerly Twitter) account, if available.
        |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** |
        Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies
        endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use cases\n\n- Link TMDB movies to
        their IMDb pages.\n    \n- Correlate movie records across multiple movie databases.\n    \n- Enrich TMDB metadata
        with information from external services.\n    \n- Generate links to third-party movie resources.\n    \n- Integrate
        TMDB data into applications that aggregate information from multiple platforms."
      operationId: getMovieExternalIds
      parameters: []
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/keywords:
    get:
      summary: Keywords
      responses:
        '200':
          description: Keywords
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieKeywordsResponse'
              example:
                id: 550
                keywords:
                  - id: 825
                    name: support group
                  - id: 803
                    name: dual identity
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the keywords associated with a specific movie. Keywords are descriptive tags that represent
        themes, topics, settings, events, or concepts related to a movie.\n\n# Path parameters\n\n| Parameter | Type | Required
        | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier of the movie.
        |\n\n# Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/keywords\n\n ```\n\n# Example success response\n\
        \n``` json\n{\n  \"id\": 550,\n  \"keywords\": [\n    {\n      \"id\": 825,\n      \"name\": \"support group\"\n \
        \   },\n    {\n      \"id\": 803,\n      \"name\": \"dual identity\"\n    }\n  ]\n}\n\n ```\n\n# Response fields\n\
        \n| Field | Description |\n| --- | --- |\n| `id` | The unique TMDB identifier of the movie. |\n| `keywords` | An array
        of keyword objects associated with the movie. |\n| `keywords.id` | The unique identifier of the keyword. |\n| `keywords.name`
        | The descriptive name of the keyword. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example
        response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\":
        false, \"status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified
        movie_id does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id
        is correct.  <br>\\* Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n\
        Note: Keywords provide a finer level of classification than genres, allowing developers to group movies by specific
        themes, story elements, or concepts rather than broad categories.\n\n# Common use cases\n\n- Categorize movies using
        descriptive themes.\n    \n- Improve search relevance and filtering.\n    \n- Build recommendation engines based on
        shared keywords.\n    \n- Discover movies with similar themes or concepts.\n    \n- Enrich movie metadata for analytics
        or content management.\n    \n\n# Keywords vs. genres\n\nAlthough both keywords and genres describe a movie, they
        serve different purposes.\n\n| Genres | Keywords |\n| --- | --- |\n| Broad categories that classify a movie. | Specific
        tags that describe themes, topics, settings, or plot elements. |\n| Limited set of predefined categories. | More detailed
        and descriptive metadata. |\n| Example: **Action**, **Comedy**, **Drama** | Example: **time travel**, **serial killer**,
        **space exploration**, **coming of age** |\n\nFor example, two movies may both belong to the **Science Fiction** genre,
        but one may have the keywords **artificial intelligence** and **space exploration**, while the other has **time loop**
        and **parallel universe**. Keywords provide the additional context needed to distinguish movies with similar genres."
      operationId: getMovieKeywords
      parameters: []
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/latest:
    get:
      summary: Latest Movie
      responses:
        '200':
          description: Latest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestMovieResponse'
              example:
                id: 1573369
                title: Example Movie
                overview: Recently added movie entry in TMDB.
                release_date: '2026-07-01'
                runtime: 102
                popularity: 1.2
                vote_average: 0.0
                vote_count: 0
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the most recently created movie record in the TMDB database.\n\n### Example request\n\n```\n\
        GET {{base_url}}/movie/latest\n\n ```\n\n### Example success response\n\n``` json\n{\n  \"id\": 1573369,\n  \"title\"\
        : \"Example Movie\",\n  \"overview\": \"Recently added movie entry in TMDB.\",\n  \"release_date\": \"2026-07-01\"\
        ,\n  \"runtime\": 102,\n  \"popularity\": 1.2,\n  \"vote_average\": 0.0,\n  \"vote_count\": 0\n}\n\n ```\n\n# Response
        fields\n\n| Field | Description |\n| --- | --- |\n| `id` | Unique TMDB identifier of the movie. |\n| `title` | Official
        movie title. |\n| `overview` | Summary or synopsis of the movie. |\n| `release_date` | Official release date. |\n\
        | `genres` | Genres associated with the movie. |\n| `runtime` | Duration of the movie in minutes. |\n| `popularity`
        | TMDB popularity score. |\n| `vote_average` | Average user rating. |\n| `vote_count` | Total number of user ratings.
        |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** |
        Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{ \"success\": false, \"status_code\": 3, \"\
        status_message\": \"Authentication failed: You do not have permissions to access the service.\" }` | \\* Missing or
        invalid Bearer token.  <br>\\* Invalid API credentials. | \\* Ensure a valid Bearer token is included in the request
        header. |\n\n### Common use cases\n\n- Monitor newly added movie records.\n    \n- Test API integrations with real-time
        TMDB data.\n    \n- Verify that an application can process movie detail responses.\n    \n- Trigger content ingestion
        or synchronization workflows.\n    \n- Retrieve a current example movie object during development.\n    \n\n### Note\n\
        \nThe latest movie is determined by the creation time of the TMDB record, not by the movie’s release date or popularity.
        This means the endpoint may return:\n\n- unreleased movies,\n    \n- recently added catalog entries,\n    \n- placeholder
        records,\n    \n- or movies with incomplete metadata.\n    \n\nFor example, a movie released in 1995 but added to
        TMDB today may be returned by this endpoint.\n\nTip: This endpoint is most useful for monitoring and testing purposes.
        If your goal is to discover recently released movies, use endpoints such as **Now Playing Movies**, **Upcoming Movies**,
        or **Discover Movies** with release date filters instead."
      operationId: getLatestMovie
      parameters: []
  /movie/{movie_id}/lists:
    get:
      summary: Lists
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieListResponse'
              example:
                page: 1
                results:
                  - id: 12345
                    name: Example Movie List
                    description: A sample public list.
                    item_count: 10
                    favorite_count: 5
                    poster_path: /example.jpg
                total_pages: 1
                total_results: 1
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the public TMDB lists that include a specified movie. A TMDB list is a user-created or community-curated
        collection of movies grouped around a common theme, topic, genre, or purpose.\n\n# Path parameters\n\n| Parameter
        | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier
        of the movie. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description | Example |\n| --- | --- | ---
        | --- | --- |\n| `page` | Integer | No | Specifies the page of results to retrieve. | `1` |\n\n# Example request\n\
        \n```\nGET {{base_url}}/movie/{{movie_id}}/lists?page=1\n\n ```\n\n# Example success response\n\n``` json\n{\n  \"\
        page\": 1,\n  \"results\": [\n    {\n      \"id\": 12345,\n      \"name\": \"Best Movies of the 1990s\",\n      \"\
        description\": \"A collection of iconic films from the 1990s.\",\n      \"item_count\": 50,\n      \"favorite_count\"\
        : 275\n    }\n  ],\n  \"total_pages\": 1,\n  \"total_results\": 1\n}\n\n ```\n\n# Response fields\n\n| Field | Description
        |\n| --- | --- |\n| `id` | Unique identifier of the list. |\n| `name` | Name of the list. |\n| `description` | Brief
        description of the list. |\n| `item_count` | Number of movies contained in the list. |\n| `favorite_count` | Number
        of users who have favorited the list. |\n| `poster_path` | Relative path to the list's poster image. |\n\n## Endpoint-specific
        error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution |\n| --- | --- |
        --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\": \"The resource
        you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\ * The movie_id is invalid
        or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies endpoint to retrieve
        a valid movie ID before making the request. |\n\n# Common use cases\n\n- Discover community-curated movie collections.\n\
        \    \n- Recommend movies based on shared user-created lists.\n    \n- Explore themed movie lists (for example, \"\
        Best Psychological Thrillers\" or \"Award-Winning Films\").\n    \n- Build recommendation and content discovery features.\n\
        \    \n- Surface user-generated content within an application.\n    \n\n# Notes\n\n- Only **public** TMDB lists are
        returned.\n    \n- Private lists are not included in the response.\n    \n- A movie can belong to multiple public
        lists.\n    \n- Results are paginated using the `page` query parameter.\n    \n\nAlso, a **TMDB list** is different
        from a **collection** or a **watchlist**:\n\n| Resource | Purpose |\n| --- | --- |\n| **List** | A user-created or
        community-curated group of movies organized around a theme or topic. |\n| **Collection** | A TMDB-managed set of related
        movies that belong to the same franchise or series (for example, the _Harry Potter Collection_). |\n| **Watchlist**
        | A personal list maintained by an authenticated user to keep track of movies they want to watch. |\n\nUnderstanding
        this distinction helps you choose the appropriate endpoint based on your application's needs."
      operationId: getMovieLists
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/recommendations:
    get:
      summary: Recommendations
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecommendedMovieResponse'
              example:
                page: 1
                results:
                  - id: 680
                    title: Pulp Fiction
                    overview: The lives of several characters...
                    release_date: '1994-09-10'
                    vote_average: 8.5
                    popularity: 42.0
                total_pages: 12
                total_results: 240
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves movie recommendations for a specified movie.\n\n# Path parameters\n\n| Parameter | Type | Required
        | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier of the movie
        for which recommendations are requested. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description |
        Example |\n| --- | --- | --- | --- | --- |\n| `page` | Integer | No | Specifies the page of results to retrieve. |
        `1` |\n| `language` | String | No | Specifies the language used for localized movie information. | `en-US` |\n\n#
        Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/recommendations?language=en-US&page=1\n\n ```\n\n# Example
        success response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 680,\n      \"title\": \"\
        Pulp Fiction\",\n      \"release_date\": \"1994-09-10\",\n      \"vote_average\": 8.5\n    }\n  ],\n  \"total_pages\"\
        : 12,\n  \"total_results\": 240\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n| `page`
        | Current page of the paginated results. |\n| `results` | An array of recommended movies. |\n| `total_pages` | Total
        number of pages available. |\n| `total_results` | Total number of recommended movies returned by the endpoint. |\n\
        | `id` | Unique TMDB identifier of the recommended movie. |\n| `title` | Movie title. |\n| `overview` | Brief synopsis
        of the movie. |\n| `release_date` | Official release date. |\n| `vote_average` | Average user rating. |\n| `popularity`
        | TMDB popularity score. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response
        | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"\
        status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id
        does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.\
        \  <br>\\* Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use
        cases\n\n- Build **\"You May Also Like\"** sections.\n    \n- Display personalized movie recommendations.\n    \n\
        - Enhance content discovery experiences.\n    \n- Increase user engagement by suggesting related movies.\n    \n-
        Create recommendation carousels and browsing features.\n    \n\n# Recommendations vs. similar movies\n\nAlthough both
        endpoints return related movies, they are designed for different purposes.\n\n| Recommendations | Similar Movies |\n\
        | --- | --- |\n| Generated using TMDB's recommendation algorithm. | Based primarily on shared metadata and content
        attributes. |\n| Influenced by factors such as audience behavior, ratings, and relationships between movies. | Determined
        by similarities such as genres, keywords, themes, and other movie characteristics. |\n| Focuses on helping users discover
        movies they are likely to enjoy. | Focuses on identifying movies that share similar content or characteristics. |\n\
        | Results may include movies from different genres if they are strongly related by user behavior. | Results generally
        share more direct thematic or genre similarities. |\n\nTip: If your goal is to help users discover additional movies
        they are likely to enjoy based on TMDB's recommendation engine, this endpoint is your best bet. However, if your application
        instead needs movies that closely resemble the selected movie in terms of genres, themes, or other metadata, consider
        using the **Similar Movies** endpoint.\n\nNote: Recommendation results are generated dynamically by TMDB and may change
        over time as new movies are added and the recommendation algorithm is updated. Therefore, applications should treat
        recommendations as dynamic content rather than a fixed set of related movies."
      operationId: getMovieRecommendations
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
