      description: "Adds or removes a movie or TV show from an authenticated user's watchlist.\n\n# Prerequisites\n\nBefore
        calling this endpoint, ensure that you have:\n\n1. Completed the TMDB authentication workflow.\n    \n2. Obtained
        a valid `session_id`.\n    \n3. Retrieved the authenticated user's `account_id`.\n    \n\nThe request body must include:\n\
        \n- `media_type` (`movie` or `tv`)\n    \n- `media_id`\n    \n- `watchlist`\n    \n\n# Path parameters\n\n| Parameter
        | Type | Required | Description |\n| --- | --- | --- | --- |\n| `account_id` | Integer | Yes | The unique identifier
        of the authenticated TMDB account. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description |\n| ---
        | --- | --- | --- |\n| `session_id` | String | Yes | The authenticated user's session identifier. |\n\n# Request body\n\
        \n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| `media_type` | String | Yes | The type of
        media to update. Accepted values are `movie` and `tv`. |\n| `media_id` | Integer | Yes | The TMDB ID of the movie
        or TV show. |\n| `watchlist` | Boolean | Yes | Set to `true` to add the item to the watchlist or `false` to remove
        it. |\n\n# Example request\n\n```\nPOST {{base_url}}/account/{{account_id}}/watchlist?session_id={{session_id}}\n\n\
        \ ```\n\n``` json\n{\n  \"media_type\": \"movie\",\n  \"media_id\": 550,\n  \"watchlist\": true\n}\n\n ```\n\n# Example
        success response\n\n``` json\n{\n  \"success\": true,\n  \"status_code\": 1,\n  \"status_message\": \"Success.\"\n\
        }\n\n ```\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes**
        | Solution |\n| --- | --- | --- | --- | --- |\n| 400 | Bad request | `{ \"success\": false, \"status_code\": 18, \"\
        status_message\": \"Validation failed.\" }` | \\* Missing media_type.  <br>\\* Missing media_id.  <br>\\* Missing
        watchlist.  <br>\\* Invalid media_type (must be movie or tv).  <br>\\* Invalid or malformed JSON request body.  <br>\\
        * Incorrect data types supplied for one or more fields. | Ensure that the request body is valid JSON and includes
        all required fields. Verify that media_type is either movie or tv, media_id is a valid TMDB identifier, and watchlist
        is a Boolean value. |\n| 401 | Unauthorized | `{ \"success\": false, \"status_code\": 3, \"status_message\": \"Authentication
        failed: You do not have permissions to access the service.\" }` | \\* Missing or invalid session_id.  <br>\\* Expired
        session.  <br>\\* Missing or invalid Bearer token.  <br>\\* The session_id does not belong to the specified account.
        | \\* Verify that the Bearer token is valid, ensure the session_id is active, and confirm that the supplied account_id
        matches the authenticated user. |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified account_id does not exist.  <br>\\* The
        account_id is invalid or incorrectly formatted. | Retrieve the correct account_id from the Authentication collection
        before retrying the reques |\n\n# Common use cases\n\n- Allow users to save movies and TV shows for future viewing.\n\
        \    \n- Remove items after they have been watched.\n    \n- Synchronize watchlists across multiple devices.\n   \
        \ \n- Build personalized **Watch Later** experiences.\n    \n- Enable users to manage their planned viewing list.\n\
        \    \n\n# Note\n\n- Setting `watchlist` to `true` adds the specified movie or TV show to the user's watchlist.\n\
        \    \n- Setting `watchlist` to `false` removes the item from the watchlist.\n    \n- Only authenticated users can
        modify their watchlist.\n    \n- Use the **Watchlist Movies** and **Watchlist TV** endpoints to retrieve the updated
        watchlist after making changes.\n    \n\nTip: This endpoint updates a user's watchlist but does not return the updated
        list of watchlisted items. After successfully adding or removing a movie or TV show, call the **Watchlist Movies**
        or **Watchlist TV** endpoint to retrieve the current contents of the user's watchlist and confirm that the change
        has been applied."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                media_id:
                  type: integer
                watchlist:
                  type: boolean
              required:
                - media_type
                - media_id
                - watchlist
            example:
              media_type: movie
              media_id: 550
              watchlist: true
        required: true
      operationId: addToWatchlist
