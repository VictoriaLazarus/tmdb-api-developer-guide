      description: "Discovers movies by applying one or more filtering and sorting criteria instead of a search query.\n\n\
        ## Common query parameters\n\n| Parameter | Description | Example |\n| --- | --- | --- |\n| `language` | Specifies
        the language of the returned results. | `en-US` |\n| `sort_by` | Sorts the results using a supported sort option.
        | `popularity.desc` |\n| `page` | Returns a specific page of results. | `1` |\n| `with_genres` | Filters movies by
        one or more genre IDs. | `28,12` |\n| `primary_release_year` | Filters movies by release year. | `2025` |\n| `vote_average.gte`
        | Returns movies with at least the specified average rating. | `7.5` |\n| `vote_count.gte` | Returns movies with at
        least the specified number of votes. | `100` |\n| `with_original_language` | Filters movies by their original language.
        | `en` |\n| `with_watch_providers` | Filters movies available from specific streaming providers. | `8` |\n| `watch_region`
        | Specifies the country used for watch provider filtering. | `US` |\n\n``` bash\ncurl --request GET \\\n  --url '{{base_url}}/discover/movie?with_genres=28&primary_release_year=2025&sort_by=popularity.desc'\n\
        \n ```\n\n## Example response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"adult\": false,\n \
        \     \"backdrop_path\": \"/1RgPyOhN4DRs225BGTlHJqCudII.jpg\",\n      \"genre_ids\": [16, 28, 14],\n      \"id\":
        1311031,\n      \"title\": \"Demon Slayer: Kimetsu no Yaiba Infinity Castle\",\n      \"original_language\": \"ja\"\
        ,\n      \"original_title\": \"劇場版「鬼滅の刃」無限城編 第一章 猗窩座再来\",\n      \"overview\": \"The Demon Slayer Corps are drawn
        into the Infinity Castle...\",\n      \"popularity\": 94.8947,\n      \"poster_path\": \"/fWVSwgjpT2D78VUh6X8UBd2rorW.jpg\"\
        ,\n      \"release_date\": \"2025-07-18\",\n      \n      \"video\": false,\n      \"vote_average\"\
        : 7.737,\n      \"vote_count\": 896\n    }\n  ],\n  \"total_pages\": 98,\n  \"total_results\": 1948\n}\n\n ```\n\n\
        # Response field\n\n| Field | Type | Description |\n| --- | --- | --- |\n| `page` | Integer | The current page number.
        |\n| `results` | Array | Contains movies that match the specified filters. |\n| `results[].adult` | Boolean | Indicates
        whether the movie is classified as adult content. |\n| `results[].backdrop_path` | String / null | The relative path
        to the movie's backdrop image. |\n| `results[].genre_ids` | Array | Contains the TMDB genre IDs associated with the
        movie. |\n| `results[].id` | Integer | The unique TMDB ID of the movie. |\n| `results[].title` | String | The movie's
        title. |\n| `results[].original_language` | String | The original language of the movie. |\n| `results[].original_title`
        | String | The movie's original title. |\n| `results[].overview` | String | A brief description of the movie. |\n\
        | `results[].popularity` | Number | The movie's popularity score on TMDB. |\n| `results[].poster_path` | String /
        null | The relative path to the movie's poster image. |\n| `results[].release_date` | String | The movie's release
        date in `YYYY-MM-DD` format. |\n|
        content. |\n| `results[].video` | Boolean | Indicates whether the movie is a video. |\n| `results[].vote_average`
        | Number | The average user rating for the movie. |\n| `results[].vote_count` | Integer | The number of votes received
        by the movie. |\n| `total_pages` | Integer | The total number of pages available. |\n| `total_results` | Integer |
        The total number of movies matching the specified filters. |\n\n# Advanced filtering\n\nThe Discover Movies endpoint
        supports combining multiple filters to create highly targeted queries.\n\nFor example, you can retrieve:\n\n- Action
        movies released in **2024**.\n    \n- Movies with an average rating of **8.0 or higher**.\n    \n- Movies available
        on a specific streaming provider.\n    \n- Movies in a particular language or region.\n    \n- Family-friendly movies
        based on certification.\n    \n- Highly rated movies with a minimum number of user votes.\n    \n\n# Region-based
        release dates\n\nWhen the `region` parameter is supplied, TMDB uses the movie's **regional release date** instead
        of its primary release date.\n\nIf the `with_release_type` parameter is also specified, the returned release date
        is determined by the order of the requested release types.\n\nFor example:\n\n- `with_release_type=2|3` prioritizes
        the **limited theatrical** release before the **wide theatrical** release.\n    \n- `with_release_type=3|2` prioritizes
        the **wide theatrical** release before the **limited theatrical** release.\n    \n\nThis behavior is useful when building
        applications that display release dates specific to a particular country or release strategy.\n\n# AND / OR filter
        logic\n\nSeveral filtering parameters support combining multiple values using commas (`,`) or pipes (`|`).\n\n| Separator
        | Behavior | Example |\n| --- | --- | --- |\n| `,` | **AND** — results must satisfy **all** specified values. | `with_genres=28,12`
        |\n| \\` | \\` | **OR** — results may satisfy **any** of the specified values. |\n\nFor example:\n\n- `with_genres=28,12`
        returns movies classified as **both Action and Adventure**.\n    \n- `with_genres=28\\|12` returns movies classified
        as **Action or Adventure**.\n    \n\nUsing this logic allows developers to create more flexible and precise discovery
        queries.\n\n# Common use cases\n\n- Build **Browse Movies** pages.\n    \n- Recommend movies based on user preferences.\n\
        \    \n- Filter movies by genre, language, certification, or streaming provider.\n    \n- Display popular, top-rated,
        or recently released movies.\n    \n- Create advanced movie filtering interfaces.\n    \n\n# Note\n\n- Does not require
        a search query (`query`).\n    \n- Supports over **30 filtering and sorting parameters**.\n    \n- Returns results
        in a paginated format.\n    \n- Multiple filters can be combined to create highly specific searches.\n    \n- Each
        movie includes a TMDB movie ID you can use with the Movie collection to retrieve detailed information.\n    \n\n**Note:**
        This endpoint supports more than 30 query parameters. The parameters listed above are the most commonly used. Refer
        to the TMDB API reference for the complete list of supported filters and sorting options."
      operationId: discoverMovies
