      description: |-
        Retrieves user-submitted reviews for a movie, including review content, author information, ratings, and publication metadata.

        ## Common use cases

        - Displaying audience reviews
        - Building movie review sections
        - Analyzing user sentiment
        - Enhancing movie recommendation systems
        - Providing social proof and community feedback

        ## Author details

        The response may include additional information about the reviewer:

        | Field | Description |
        | --- | --- |
        | username | TMDB username |
        | avatar_path | User profile image path |
        | rating | Rating assigned by the reviewer |

        ## Notes

        A movie may have multiple reviews that may differ from the movie's overall average rating.

        ### Difference between reviews and ratings

        **Reviews**

        - Contain written feedback and opinions
        - May include an optional rating
        - Provide detailed audience perspectives

        **Ratings**

        - Consists solely of numerical scores
        - Do not include written commentary
        - Are aggregated into the movie's overall rating

        **Note:** The Reviews endpoint returns detailed written feedback from users, whereas the movie's `vote_average` and `vote_count` fields provide aggregated rating statistics without review content.
