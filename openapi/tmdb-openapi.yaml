        - Trigger content ingestion or synchronization workflows.
        - Retrieve a current example movie object during development.

        ## Notes

        The latest movie is determined by the creation time of the TMDB record, not by the movie’s release date or popularity. This means the endpoint may return:

        - unreleased movies,
        - recently added catalog entries,
        - placeholder records,
        - or movies with incomplete metadata.

        For example, a movie released in 1995 but added to TMDB today may be returned by this endpoint.

        Tip: This endpoint is most useful for monitoring and testing purposes. If your goal is to discover recently released movies, use endpoints such as **Now Playing Movies**, **Upcoming Movies**, or **Discover Movies** with release date filters instead.
