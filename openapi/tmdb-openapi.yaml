  /movie/{movie_id}/watch/providers:
    get:
      tags:
      - Movies
      summary: Watch Providers
      description: |-
        Retrieves streaming, rental, and purchase provider information for a movie across supported regions. This endpoint enables applications to display where users can watch, rent, or buy a movie based on their location.

        ## Common use cases

        - Displaying "Where to Watch" sections
        - Building streaming availability features
        - Comparing viewing options across regions
        - Supporting content discovery applications
        - Directing users to streaming platforms

        ## Availability types

        The response categorizes providers into different viewing options:

        | Type | Description |
        | --- | --- |
        | flatrate | Available through a subscription service |
        | rent | Available for rental |
        | buy | Available for purchase |

        ## Understanding regional results

        The response is grouped by country codes:

        | Code | Region |
        | --- | --- |
        | US | United States |
        | GB | United Kingdom |
        | CA | Canada |
        | AU | Australia |

        For example:

        ```json
        {
          "results": {
            "US": {
              "link": "https://www.themoviedb.org/movie/550/watch",
              "flatrate": [
                {
                  "provider_name": "Netflix"
                }
              ]
            },
            "GB": {
              "link": "https://www.themoviedb.org/movie/550/watch",
              "rent": [
                {
                  "provider_name": "Amazon Video"
                }
              ]
            }
          }
        }
        ```

        This indicates that provider availability differs between the United States and the United Kingdom.

        ## Difference between Movie Details and Watch Providers

        ### Movie Details

        Returns:

        - Title
        - Overview
        - Genres
        - Release date
        - Ratings

        ### Watch Providers

        Returns:

        - Streaming services
        - Rental platforms
        - Purchase options
        - Regional availability

        Use this endpoint when users need to know **where a movie can be watched**, rather than information about the movie itself.

        ## Notes

        Watch provider availability varies by country and region. A movie may be available on different streaming services depending on the user's location.

        Not all movies have watch provider information available for every supported region.

        Watch provider availability is region-specific. Applications should inspect the country code within the response and display provider information relevant to the user's location.
