          description: Collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionSearchResponse'
              example:
                page: 1
                results:
                  - id: 10
                    name: Star Wars Collection
                    overview: An epic space opera franchise...
                    poster_path: /abc123.jpg
                    backdrop_path: /xyz456.jpg
                total_pages: 1
                total_results: 1
      tags:
        - Search
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Searches TMDB collections using their original, translated, or alternative names.\n\n## Query parameter\n\
        \n| Parameter | Type | Required | Description | Example |\n| --- | --- | --- | --- | --- |\n| `query` | String | Yes
        | The name or keyword used to search for movie collections. Searches are performed against original, translated, and
        alternative collection names. | `Harry Potter` |\n| `language` | String | No | Specifies the language of the returned
        results. | `en-US` |\n| `page` | Integer | No | Returns a specific page of search results. | `1` |\n\n### Example
        request\n\n```\n{{base_url}}/search/collection?query=Harry Potter&language=en-US&page=1\n\n ```\n\n## Example success
        response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 10,\n      \"name\": \"Star Wars Collection\"\
        ,\n      \"overview\": \"An epic space opera franchise...\",\n      \"poster_path\": \"/abc123.jpg\",\n      \"backdrop_path\"\
        : \"/xyz456.jpg\"\n    }\n  ],\n  \"total_pages\": 1,\n  \"total_results\": 1\n}\n\n ```\n\n## Response fields\n\n\
        | Field | Type | Description |\n| --- | --- | --- |\n| `page` | Integer | The current page of search results. |\n\
        | `results` | Array | An array containing collections that match the search query. |\n| `results[].id` | Integer |
        The unique TMDB identifier of the collection. |\n| `results[].name` | String | The name of the collection. |\n| `results[].overview`
        | String | A brief description of the collection and its contents. |\n| `results[].poster_path` | String / Null |
        The path to the collection's poster image. |\n| `results[].backdrop_path` | String / Null | The path to the collection's
        backdrop image. |\n| `total_pages` | Integer | The total number of pages available for the search results. |\n| `total_results`
        | Integer | The total number of collections matching the search query. |\n\n**Note:** `poster_path` and `backdrop_path`
        are image paths rather than complete image URLs. Your application can combine these paths with TMDB's image base URL
        to construct the corresponding image URL.\n\n## Endpoint-specific error\n\n| **Error status** | **Description** |
        Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 400 | Bad Request | `{ \"\
        success\": false, \"status_code\": 22, \"status_message\": \"Invalid parameter: query must be provided.\" }` | \\\
        * The query parameter is missing.  <br>\\* The query parameter is empty.  <br>\\* The request contains an invalid
        query value. | Provide a valid search term in the query parameter and retry the request. |\n\n## Common use cases\n\
        \n- Search for movie franchises or series.\n    \n- Display collection suggestions as users type.\n    \n- Retrieve
        collection metadata before requesting collection details.\n    \n- Navigate users to related movies within a franchise.\n\
        \    \n\n### Note\n\n- Returns results that match the collection's original, translated, or alternative names.\n \
        \   \n- Results are paginated and support the `page` query parameter.\n    \n- Only collection metadata is returned.\n\
        \    \n- Collections represent groups of related movies that belong to the same franchise or series, such as trilogies
        or cinematic universes."
      operationId: searchCollections
