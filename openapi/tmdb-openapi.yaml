      summary: Recommendations
      description: |-
        Retrieves movie recommendations for a specified movie.

        ## Common use cases

        - Build **"You May Also Like"** sections.
        - Display personalized movie recommendations.
        - Enhance content discovery experiences.
        - Increase user engagement by suggesting related movies.
        - Create recommendation carousels and browsing features.

        ## Recommendations vs. similar movies

        Although both endpoints return related movies, they are designed for different purposes.

        | Recommendations | Similar Movies |
        | --- | --- |
        | Generated using TMDB's recommendation algorithm. | Based primarily on shared metadata and content attributes. |
        | Influenced by factors such as audience behavior, ratings, and relationships between movies. | Determined by similarities such as genres, keywords, themes, and other movie characteristics. |
        | Focuses on helping users discover movies they are likely to enjoy. | Focuses on identifying movies that share similar content or characteristics. |
        | Results may include movies from different genres if they are strongly related by user behavior. | Results generally share more direct thematic or genre similarities. |

        Tip: If your goal is to help users discover additional movies they are likely to enjoy based on TMDB's recommendation engine, this endpoint is your best bet. However, if your application instead needs movies that closely resemble the selected movie in terms of genres, themes, or other metadata, consider using the **Similar Movies** endpoint.

        Note: Recommendation results are generated dynamically by TMDB and may change over time as new movies are added and the recommendation algorithm is updated. Therefore, applications should treat recommendations as dynamic content rather than a fixed set of related movies.
