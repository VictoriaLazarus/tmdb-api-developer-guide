  /movie/{movie_id}:
    get:
      tags:
      - Movies
      summary: Movie Details
      description: |-
        Retrieves detailed information about a specific movie identified by its unique TMDB ID.

        ## Common use cases

        - Display detailed information about a movie.
        - Retrieve metadata for a movie details page.
        - Obtain production companies, genres, runtime, and release information.
        - Retrieve localized movie information using the `language` parameter.
        - Fetch related resources using the `append_to_response` parameter.

        ## Notes

        The `append_to_response` parameter is optional but can improve performance by retrieving related resources in a single request. Also, this endpoint retrieves public movie information and does not require a `session_id` or `account_id`.
      operationId: getMovieDetails
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: movie_id
        in: path
        required: true
        description: The TMDB ID of the movie.
        schema:
          type: integer
          example: 550
      - name: append_to_response
        in: query
        description: Comma-separated list of endpoints within this namespace, up to 20 items.
        schema:
          type: string
        example: credits,videos
      - name: language
        in: query
        schema:
          type: string
          default: en-US
        example: en-US
        description: Specifies the language used for localized movie information.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetails'
              example:
                id: 550
                title: Fight Club
                overview: A depressed office worker forms an underground fight club...
                release_date: '1999-10-15'
                runtime: 139
                genres:
                - id: 18
                  name: Drama
                vote_average: 8.4
                vote_count: 29000
                popularity: 85.2
        '404':
          description: |-
            Not found. TMDB has no resource matching the supplied identifier or path.

            **Possible causes**

            - The specified movie_id does not exist.
            - The movie_id is invalid or incorrectly formatted.
            - The requested resource has been removed or is unavailable.

            **How to fix it**

            - Verify that the movie_id is correct.
            - Use the Search Movies endpoint to retrieve a valid movie ID before making the request.
            - Ensure the path parameter is an integer.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id004
                success: false
                status_code: 34
                status_message: The resource you requested could not be found.
    parameters:
    - name: movie_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: '{{movie_id}}'
  /movie/{movie_id}/account_states:
    get:
      tags:
      - Movies
      summary: Account States
      description: |-
        Retrieves the authenticated user's account-specific state for a particular movie.

        Note: An account state represents the authenticated user's relationship with a specific movie. It indicates whether the user has marked the movie as a favorite, added it to a watchlist, or submitted a personal rating. Unlike public movie metadata, these values are unique to each authenticated user.

        ## Prerequisites

        This endpoint requires:

        - A valid `movie_id`.
        - A valid authenticated `session_id`.
        - A valid Bearer token.

        Requests made without a valid authenticated session return an authentication error.

        ## Common use cases

        - Display whether a movie has been added to the user's watchlist.
        - Show whether the movie is marked as a favorite.
        - Display the user's existing rating for the movie.
        - Personalize a movie details page based on the authenticated user's interactions.
        - Determine whether rating or watchlist actions should be displayed in the UI.
      operationId: getMovieAccountStates
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: movie_id
        in: path
        required: true
        description: The TMDB ID of the movie.
        schema:
          type: integer
          example: 550
      - name: session_id
        in: query
        schema:
          type: string
        example: '{{session_id}}'
        required: false
        description: User session identifier. Provide either session_id or guest_session_id.
      - name: guest_session_id
        in: query
        schema:
          type: string
        example: '{{guest_session_id}}'
        required: false
        description: Guest session identifier. Provide either guest_session_id or session_id.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieAccountStates'
              example:
                id: 550
                favorite: true
                watchlist: false
                rated:
                  value: 8.5
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - The session_id is missing.
            - The session_id is invalid or has expired.
            - The Bearer token is missing or invalid.
            - The request was made without an authenticated user session.

            **How to fix it**

            - Ensure a valid Bearer token is included in the Authorization header.
            - Verify that the session_id was created successfully and has not expired.
            - Confirm that the session_id belongs to the authenticated user.
            - Retry the request after correcting the authentication credentials.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
        '404':
          description: |-
            Not found. TMDB has no resource matching the supplied identifier or path.

            **Possible causes**

            - The specified movie_id does not exist.
            - An invalid movie_id was supplied.

            **How to fix it**

            - Verify that the movie_id is correct, or use the Search Movies endpoint to obtain a valid movie ID before retrying the request.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
    parameters:
    - name: movie_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: '{{movie_id}}'
