      summary: TV
      description: |-
        Discovers TV shows by applying one or more filtering and sorting criteria instead of a search query.

        > **Note**: This endpoint retrieves public TMDB data and does not require a `session_id` or `account_id`.

        ## Common use cases

        - Build **Browse TV Shows** pages.
        - Recommend TV series based on genres or ratings.
        - Filter TV shows by language, streaming provider, or first air date.
        - Display popular, top-rated, or recently premiered TV series.
        - Create advanced filtering experiences for television content.

        ## TV-specific filtering

        The Discover TV endpoint shares many filtering options with **Discover Movies**, but it also includes parameters specific to television content.

        | Discover Movies | Discover TV |
        | --- | --- |
        | `primary_release_year` | `first_air_date_year` |
        | `primary_release_date.gte` | `first_air_date.gte` |
        | `primary_release_date.lte` | `first_air_date.lte` |

        Use `first_air_date_year` when you want to retrieve TV shows that premiered during a specific year.

        For example:

        ```
        GET {{base_url}}/discover/tv?first_air_date_year=2024
        ```

        This request returns TV shows whose first episode aired in **2024**.

        ## AND / OR Filter Logic

        Several filtering parameters support combining multiple values using commas (`,`) or pipes (`|`).

        | Separator | Behavior | Example |
        | --- | --- | --- |
        | `,` | **AND** — results must satisfy all specified values. | `with_genres=18,10765` |
        | ` | ` | **OR** — results may satisfy any specified value. |

        For example:

        - `with_genres=18,10765` returns TV shows that are both **Drama** and **Sci-Fi & Fantasy**.
        - `with_genres=18|10765` returns TV shows that are **Drama** or **Sci-Fi & Fantasy**.

        ## Notes

        - Does not require a search query (`query`).
        - Supports advanced filtering and sorting through multiple query parameters.
        - Returns results in a paginated format.
        - Multiple filters can be combined to create highly specific discovery queries.
        - Each TV show includes a unique TMDB TV series ID that can be used with the TV collection to retrieve additional information.

        **Note:** The Discover TV endpoint supports many of the same filtering and sorting options as **Discover Movies**. However, TV-specific parameters such as `first_air_date_year`, `first_air_date.gte`, and `first_air_date.lte` replace the movie-specific release date parameters. Use the endpoint that corresponds to the type of media you want to discover.
      operationId: discoverTV
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: air_date.gte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a air date greater than or equal to the supplied value.
      - name: air_date.lte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a air date less than or equal to the supplied value.
      - name: first_air_date_year
        in: query
        schema:
          type: integer
          format: int32
        description: Filter TV shows by the year they first aired.
        example: '2022'
      - name: first_air_date.gte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a first air date greater than or equal to the supplied
          value.
      - name: first_air_date.lte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a first air date less than or equal to the supplied
          value.
      - name: include_adult
        in: query
        schema:
          type: boolean
          default: false
        description: Whether to include adult content in the results. Defaults to `false`.
      - name: include_null_first_air_dates
        in: query
        schema:
          type: boolean
          default: false
        description: Whether to include TV shows that have no first air date.
      - name: language
        in: query
        schema:
          type: string
          default: en-US
        description: Specifies the language of the returned results.
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: Specify the results page to return.
        example: '1'
      - name: screened_theatrically
        in: query
        schema:
          type: boolean
        description: Restrict results to titles that were screened theatrically.
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - original_name.asc
          - original_name.desc
          - popularity.asc
          - popularity.desc
          - vote_average.asc
          - vote_average.desc
          - vote_count.asc
          - vote_count.desc
          - first_air_date.asc
          - first_air_date.desc
          - name.asc
          - name.desc
          default: popularity.desc
        description: Sort results by popularity, vote average, first air date, and other supported fields.
        example: popularity.desc
      - name: timezone
        in: query
        schema:
          type: string
        description: Timezone used to calculate release windows, such as `America/New_York`.
      - name: vote_average.gte
        in: query
        schema:
          type: number
          format: float
        description: Return only TV shows with a vote average greater than or equal to the specified value.
        example: '7.0'
      - name: vote_average.lte
        in: query
        schema:
          type: number
          format: float
        description: Filter results to titles with a vote average less than or equal to the supplied value.
      - name: vote_count.gte
        in: query
        schema:
          type: number
          format: float
        description: Returns TV shows with at least the specified number of votes.
      - name: vote_count.lte
        in: query
        schema:
