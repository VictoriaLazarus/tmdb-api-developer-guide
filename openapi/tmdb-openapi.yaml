  /discover/movie:
    get:
      tags:
      - Discover
      summary: Movie
      description: |-
        Discovers movies by applying one or more filtering and sorting criteria instead of a search query.

        ## Common use cases

        - Build **Browse Movies** pages.
        - Recommend movies based on user preferences.
        - Filter movies by genre, language, certification, or streaming provider.
        - Display popular, top-rated, or recently released movies.
        - Create advanced movie filtering interfaces.

        ## Advanced filtering

        The Discover Movies endpoint supports combining multiple filters to create highly targeted queries.

        For example, you can retrieve:

        - Action movies released in **2024**.
        - Movies with an average rating of **8.0 or higher**.
        - Movies available on a specific streaming provider.
        - Movies in a particular language or region.
        - Family-friendly movies based on certification.
        - Highly rated movies with a minimum number of user votes.

        ## Region-based release dates

        When the `region` parameter is supplied, TMDB uses the movie's **regional release date** instead of its primary release date.

        If the `with_release_type` parameter is also specified, the returned release date is determined by the order of the requested release types.

        For example:

        - `with_release_type=2|3` prioritizes the **limited theatrical** release before the **wide theatrical** release.
        - `with_release_type=3|2` prioritizes the **wide theatrical** release before the **limited theatrical** release.

        This behavior is useful when building applications that display release dates specific to a particular country or release strategy.

        ## AND / OR filter logic

        Several filtering parameters support combining multiple values using commas (`,`) or pipes (`|`).

        | Separator | Behavior | Example |
        | --- | --- | --- |
        | `,` | **AND** — results must satisfy **all** specified values. | `with_genres=28,12` |
        | ` | ` | **OR** — results may satisfy **any** of the specified values. |

        For example:

        - `with_genres=28,12` returns movies classified as **both Action and Adventure**.
        - `with_genres=28|12` returns movies classified as **Action or Adventure**.

        Using this logic allows developers to create more flexible and precise discovery queries.

        ## Notes

        - Does not require a search query (`query`).
        - Supports over **30 filtering and sorting parameters**.
        - Returns results in a paginated format.
        - Multiple filters can be combined to create highly specific searches.
        - Each movie includes a TMDB movie ID you can use with the Movie collection to retrieve detailed information.

        **Note:** This endpoint supports more than 30 query parameters. The parameters listed above are the most commonly used. Refer to the TMDB API reference for the complete list of supported filters and sorting options.
      operationId: discoverMovies
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: certification
        in: query
        description: Use in conjunction with `region`.
        schema:
          type: string
      - name: certification.gte
        in: query
        description: Use in conjunction with `region`.
        schema:
          type: string
      - name: certification.lte
        in: query
        description: Use in conjunction with `region`.
        schema:
          type: string
      - name: certification_country
        in: query
        description: Use in conjunction with certification filters.
        schema:
          type: string
      - name: include_adult
        in: query
        schema:
          type: boolean
          default: false
        description: Whether to include adult content in the results. Defaults to `false`.
      - name: include_video
        in: query
        schema:
          type: boolean
          default: false
        description: Whether to include video-only titles in the results.
      - name: language
        in: query
        schema:
          type: string
          default: en-US
        description: Specifies the language of the returned results.
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: Pagination control
        example: '1'
      - name: primary_release_year
        in: query
        schema:
          type: integer
          format: int32
        description: Filter movies by year
        example: '2023'
      - name: primary_release_date.gte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a primary release date greater than or equal to the
          supplied value.
      - name: primary_release_date.lte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a primary release date less than or equal to the supplied
          value.
      - name: region
        in: query
        schema:
          type: string
        description: ISO 3166-1 country code used to filter release information, such as `US`.
      - name: release_date.gte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a release date greater than or equal to the supplied
          value.
      - name: release_date.lte
        in: query
        schema:
          type: string
          format: date
        description: Filter results to titles with a release date less than or equal to the supplied value.
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - original_title.asc
          - original_title.desc
          - popularity.asc
          - popularity.desc
          - revenue.asc
          - revenue.desc
          - primary_release_date.asc
          - title.asc
          - title.desc
          - primary_release_date.desc
          - vote_average.asc
          - vote_average.desc
          - vote_count.asc
          - vote_count.desc
          default: popularity.desc
        description: Sort results by popularity
        example: popularity.desc
      - name: vote_average.gte
        in: query
        schema:
          type: number
          format: float
        description: Minimum rating threshold
        example: '7.5'
      - name: vote_average.lte
        in: query
        schema:
          type: number
          format: float
        description: Filter results to titles with a vote average less than or equal to the supplied value.
      - name: vote_count.gte
        in: query
        schema:
          type: number
          format: float
        description: Returns movies with at least the specified number of votes.
      - name: vote_count.lte
        in: query
        schema:
          type: number
          format: float
        description: Filter results to titles with a vote count less than or equal to the supplied value.
      - name: watch_region
        in: query
        description: Use with watch provider filters.
        schema:
          type: string
      - name: with_cast
        in: query
        description: Can be comma (`AND`) or pipe (`OR`) separated.
        schema:
          type: string
      - name: with_companies
        in: query
        description: Can be comma (`AND`) or pipe (`OR`) separated.
        schema:
          type: string
      - name: with_crew
        in: query
        description: Can be comma (`AND`) or pipe (`OR`) separated.
        schema:
          type: string
      - name: with_genres
        in: query
        description: Filter by Action genre
        schema:
          type: string
        example: '28'
      - name: with_keywords
        in: query
        description: Can be comma (`AND`) or pipe (`OR`) separated.
        schema:
          type: string
      - name: with_origin_country
        in: query
        schema:
          type: string
        description: ISO 3166-1 country code of the title origin, such as `JP`.
      - name: with_original_language
        in: query
        schema:
          type: string
        description: Filters movies by their original language.
      - name: with_people
        in: query
        description: Can be comma (`AND`) or pipe (`OR`) separated.
        schema:
          type: string
      - name: with_release_type
        in: query
        description: 'Possible values: 1, 2, 3, 4, 5, or 6. Can be comma (`AND`) or pipe (`OR`) separated.'
        schema:
          type: integer
          format: int32
      - name: with_runtime.gte
        in: query
        schema:
          type: integer
          format: int32
        description: Filter results to titles with a with runtime greater than or equal to the supplied
          value.
      - name: with_runtime.lte
        in: query
        schema:
          type: integer
          format: int32
        description: Filter results to titles with a with runtime less than or equal to the supplied value.
      - name: with_watch_monetization_types
        in: query
        description: 'Possible values: flatrate, free, ads, rent, or buy. Use with `watch_region`.'
        schema:
          type: string
      - name: with_watch_providers
        in: query
        schema:
          type: string
        description: Filters movies available from specific streaming providers.
      - name: without_companies
        in: query
        schema:
          type: string
        description: Comma-separated list of companies to exclude from the results.
      - name: without_genres
        in: query
        schema:
          type: string
        description: Comma-separated list of genres to exclude from the results.
      - name: without_keywords
        in: query
        schema:
          type: string
        description: Comma-separated list of keywords to exclude from the results.
      - name: without_watch_providers
        in: query
        schema:
          type: string
        description: Comma-separated list of watch providers to exclude from the results.
      - name: year
        in: query
        schema:
          type: integer
          format: int32
        description: Restrict results to titles released in the given year.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscoverMovieResponse'
              example:
                page: 1
                results:
                - adult: false
                  backdrop_path: /1RgPyOhN4DRs225BGTlHJqCudII.jpg
                  genre_ids:
                  - 16
                  - 28
                  - 14
                  id: 1311031
                  title: 'Demon Slayer: Kimetsu no Yaiba Infinity Castle'
                  original_language: ja
                  original_title: 劇場版「鬼滅の刃」無限城編 第一章 猗窩座再来
                  overview: The Demon Slayer Corps are drawn into the Infinity Castle...
                  popularity: 94.8947
                  poster_path: /fWVSwgjpT2D78VUh6X8UBd2rorW.jpg
                  release_date: '2025-07-18'
                  video: false
                  vote_average: 7.737
                  vote_count: 896
                total_pages: 98
                total_results: 1948
  /discover/tv:
    get:
      tags:
