  /movie/{movie_id}/credits:
    get:
      tags:
      - Movies
      summary: Credits
      description: |-
        Retrieves the cast and crew members associated with a specific movie.

        The response is divided into two primary arrays: **cast**, which contains actors and the characters they portray, and **crew**, which contains the production personnel responsible for creating the movie, such as directors, producers, writers, editors, composers, and other contributors.

        ## Common use cases

        - Display movie cast lists.
        - Display directors, producers, writers, and other crew members.
        - Link cast and crew members to their profile pages.
        - Build movie credits pages.
        - Support actor, director, and crew search features.

        ## `cast`

        The `cast` array contains people who appear in the movie.

        | Field | Description |
        | --- | --- |
        | `id` | Unique TMDB identifier of the person. |
        | `name` | Name of the cast member. |
        | `character` | Character portrayed in the movie. |
        | `order` | Billing order in the cast list. |
        | `profile_path` | Path to the person's profile image. |

        ## `crew`

        The `crew` array contains people who contributed behind the scenes during production.

        | Field | Description |
        | --- | --- |
        | `id` | Unique TMDB identifier of the crew member. |
        | `name` | Name of the crew member. |
        | `department` | Production department (for example, Directing or Writing). |
        | `job` | Specific role performed by the crew member. |
        | `profile_path` | Path to the crew member's profile image. |
      operationId: getMovieCredits
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: movie_id
        in: path
        required: true
        description: The TMDB ID of the movie.
        schema:
          type: integer
          example: 550
      - name: language
        in: query
        schema:
          type: string
          default: en-US
        description: ISO 639-1 language code used to localise the response, such as `en-US`. Defaults
          to `en-US`.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieCreditsResponse'
              example:
                id: 550
                cast:
                - id: 287
                  name: Brad Pitt
                  character: Tyler Durden
                  order: 1
                  profile_path: /kU3B75TyRiCgE270EyZnHjfivoq.jpg
                crew:
                - id: 7467
                  name: David Fincher
                  department: Directing
                  job: Director
                  profile_path: /tpEczFclQZeKAiCVEY3qZ3c3PXp.jpg
        '404':
          description: |-
            Not found. TMDB has no resource matching the supplied identifier or path.

            **Possible causes**

            - The specified movie_id does not exist.
            - The movie_id is invalid or incorrectly formatted.

            **How to fix it**

            - Verify that the movie_id is correct.
            - Use the Search Movies endpoint to retrieve a valid movie ID before making the request.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id004
    parameters:
    - name: movie_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: '{{movie_id}}'
  /movie/{movie_id}/images:
    get:
      tags:
      - Movies
      summary: Images
      description: |-
        Retrieves the images associated with a specific movie.

        ## Common use cases

        - Display movie posters in search results and detail pages.
        - Show backdrop images as banners or hero images.
        - Display localized movie logos.
        - Build image galleries for movies.
        - Retrieve assets for marketing or promotional content.

        ## `backdrops`

        High-resolution background images commonly used as banners or hero images.

        | Field | Description |
        | --- | --- |
        | `file_path` | Relative path to the image. |
        | `width` | Image width in pixels. |
        | `height` | Image height in pixels. |
        | `iso_639_1` | Language associated with the image, if available. |
        | `vote_average` | Average community rating for the image. |
        | `vote_count` | Number of votes received. |

        ## `posters`

        Official promotional posters for the movie.

        | Field | Description |
        | --- | --- |
        | `file_path` | Relative path to the poster image. |
        | `width` | Image width in pixels. |
        | `height` | Image height in pixels. |
        | `iso_639_1` | Language associated with the poster, if available. |
        | `vote_average` | Average community rating for the image. |
        | `vote_count` | Number of votes received. |

        ## `logos`

        Official movie logos and branding assets.

        | Field | Description |
        | --- | --- |
        | `file_path` | Relative path to the logo image. |
        | `width` | Image width in pixels. |
        | `height` | Image height in pixels. |
        | `iso_639_1` | Language associated with the logo, if available. |
        | `vote_average` | Average community rating for the image. |
        | `vote_count` | Number of votes received. |

        ## Notes

        If the `language` parameter is specified, TMDB returns images that match that language. Use `include_image_language` to retrieve images in additional languages or images that are not associated with any language.
