          description: Indicates whether the request completed successfully.
        status_code:
          type: integer
          description: TMDB status code describing the result of the request.
        status_message:
          type: string
          description: Human-readable description of the result.
    AuthenticationValidationResponse:
      type: object
      required:
      - success
      - status_code
      - status_message
      properties:
        success:
          type: boolean
          description: Indicates whether the supplied credentials are valid.
        status_code:
          type: integer
          description: TMDB status code describing the result.
        status_message:
          type: string
          description: Human-readable description of the validation result.
    RequestTokenResponse:
      type: object
      required:
      - success
      - expires_at
      - request_token
      properties:
        success:
          type: boolean
          description: Indicates whether the request completed successfully.
        expires_at:
          type: string
          description: Date and time when the request token expires.
        request_token:
          type: string
          description: Temporary token used to obtain user approval and create a session.
    SessionResponse:
      type: object
      required:
      - success
      - session_id
      properties:
