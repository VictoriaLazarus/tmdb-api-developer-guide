  /authentication/session:
    delete:
      summary: Delete Session
      responses:
        '200':
          description: Delete session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeleteResponse'
              example:
                success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Deletes an active v3 session, immediately invalidating the associated `session_id`.\n\n> **Note**: Before
        calling this endpoint, ensure that you have a valid `session_id` that has not already expired. Also, once the session
        has been deleted, it can no longer be used to access authenticated TMDB endpoints that require session-based authentication.\
        \ \n  \n\n# Request body\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| `session_id` |
        String | Yes | The active session ID to delete. |\n\n# Example request and body\n\n```\nDELETE {{base_url}}/authentication/session\n\
        \n ```\n\n```\n{\n  \"session_id\": \"{{session_id}}\"\n}\n\n ```\n\n# Example success response\n\n``` json\n{\n \
        \ \"success\": true\n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n| `success` | Indicates
        whether the session was successfully deleted. If true, it means the session has been successfully deleted. |\n\n##
        Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{ success\": false, \"status_code\": 3, \"status_message\"\
        : \"Authentication failed: You do not have permissions to access the service.\" }` | \\* The provided **session_id**
        is invalid.  <br>\\* The session has already expired.  <br>\\* The request contains an incorrect or malformed session
        ID. | \\* Verify that the **session_id** is valid.  <br>\\* Generate a new session if the existing session has expired.\
        \  <br>\\* Ensure the session ID is correctly referenced from your environment. |\n\n# Note\n\n- Deleting a session
        immediately invalidates the associated `session_id`.\n    \n- Once deleted, the session cannot be restored or reused.\n\
        \    \n- To access authenticated endpoints again, you must complete the authentication workflow and create a new session.\n\
        \    \n- Deleting a session signs the user out of your application but does not revoke the user's TMDB account or
        API credentials.\n    \n\n# Common use cases\n\n- Sign a user out of an application.\n    \n- End an authenticated
        session after account operations are complete.\n    \n- Invalidate sessions that are no longer needed.\n    \n- Improve
        application security by preventing reuse of an active session.\n    \n- Support logout functionality across web and
        mobile applications.\n    \n\nTip: Deleting a session only invalidates the current **v3 session**. If the user wants
        to continue using authenticated endpoints such as **Favorites**, **Watchlists**, or **Ratings**, your application
        must create a new session by repeating the authentication workflow, which includes:\n\n1. Create a request token.\n\
        \    \n2. Validate the request token (browser approval or `validate_with_login`).\n    \n3. Create a new session.\n\
        \    \n4. Use the new `session_id` for subsequent authenticated requests."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
              required:
                - session_id
            example:
              session_id: '{{session_id}}'
      operationId: deleteSession
