        | **Collection** | A TMDB-managed set of related movies that belong to the same franchise or series (for example, the _Harry Potter Collection_). |
        | **Watchlist** | A personal list maintained by an authenticated user to keep track of movies they want to watch. |

        Understanding this distinction helps you choose the appropriate endpoint based on your application's needs.
