        Invalid ratings: `0`, `4.3`, `10.5`, `11`.

        Unlike most movie endpoints that retrieve data, this endpoint modifies user-specific data and therefore requires authentication through a valid session or guest session. This makes it part of TMDB's authenticated workflow rather than its public data retrieval APIs.
