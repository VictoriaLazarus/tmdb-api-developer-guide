  /account/{account_id}/watchlist:
    post:
      tags:
      - Account
      summary: Add to Watchlist
      description: |-
        Adds or removes a movie or TV show from an authenticated user's watchlist.

        ## Prerequisites

        Before calling this endpoint, ensure that you have:

        1. Completed the TMDB authentication workflow.
        2. Obtained a valid `session_id`.
        3. Retrieved the authenticated user's `account_id`.

        The request body must include:

        - `media_type` (`movie` or `tv`)
        - `media_id`
        - `watchlist`

        ## Common use cases

        - Allow users to save movies and TV shows for future viewing.
        - Remove items after they have been watched.
        - Synchronize watchlists across multiple devices.
        - Build personalized **Watch Later** experiences.
        - Enable users to manage their planned viewing list.

        ## Notes

        - Setting `watchlist` to `true` adds the specified movie or TV show to the user's watchlist.
        - Setting `watchlist` to `false` removes the item from the watchlist.
        - Only authenticated users can modify their watchlist.
        - Use the **Watchlist Movies** and **Watchlist TV** endpoints to retrieve the updated watchlist after making changes.

        Tip: This endpoint updates a user's watchlist but does not return the updated list of watchlisted items. After successfully adding or removing a movie or TV show, call the **Watchlist Movies** or **Watchlist TV** endpoint to retrieve the current contents of the user's watchlist and confirm that the change has been applied.
      operationId: addToWatchlist
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        description: Your TMDB account ID. Retrieve it from the Get Account Details endpoint.
        schema:
          type: integer
          example: 21857592
      - name: session_id
        in: query
        schema:
          type: string
        example: '{{session_id}}'
        required: true
        description: The authenticated user's session identifier.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  description: The type of media to update. Accepted values are `movie` and `tv`.
                media_id:
                  type: integer
                  description: The TMDB ID of the movie or TV show.
                watchlist:
                  type: boolean
                  description: Set to `true` to add the item to the watchlist or `false` to remove it.
              required:
              - media_type
              - media_id
              - watchlist
            example:
              media_type: movie
              media_id: 550
              watchlist: true
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountActionResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
        '400':
          description: |-
            Bad request. TMDB rejected the request because a parameter or value was invalid.

            **Possible causes**

            - Missing media_type.
            - Missing media_id.
            - Missing watchlist.
            - Invalid media_type (must be movie or tv).

            **How to fix it**

            - Ensure that the request body is valid JSON and includes all required fields. Verify that media_type is either movie or tv, media_id is a valid TMDB identifier, and watchlist is a Boolean value.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - Missing or invalid session_id.
            - Expired session.
            - Missing or invalid Bearer token.
            - The session_id does not belong to the specified account.

            **How to fix it**

            - Verify that the Bearer token is valid, ensure the session_id is active, and confirm that the supplied account_id matches the authenticated user.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id001
        '404':
          description: |-
            Not found. TMDB has no resource matching the supplied identifier or path.

            **Possible causes**

            - The specified account_id does not exist.
            - The account_id is invalid or incorrectly formatted.

            **How to fix it**

            - Retrieve the correct account_id from the Authentication collection before retrying the reques

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id002
    parameters:
