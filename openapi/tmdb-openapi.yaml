      description: "Retrieves video assets associated with a movie, including trailers, teasers, featurettes, clips, and behind-the-scenes
        content.\n\n## Path parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| movie_id
        | Integer | Yes | The unique identifier of the movie. |\n\n## Query parameters\n\n| Parameter | Type | Required |
        Description |\n| --- | --- | --- | --- |\n| language | String | No | Specifies the language of the returned video
        metadata. |\n\n## Video types\n\nThe `type` field may contain values such as:\n\n| Type | Description |\n| --- | ---
        |\n| Trailer | Official movie trailer |\n| Teaser | Promotional teaser video |\n| Featurette | Short feature or promotional
        segment |\n| Clip | Excerpt from the movie |\n| Behind the Scenes | Production footage and interviews |\n| Bloopers
        | Outtakes and humorous moments |\n\n## Example request\n\n```\n{{base_url}}/movie/{{movie_id}}/videos\n\n ```\n\n\
        ## Example response\n\n``` json\n{\n  \"id\": 550,\n  \"results\": [\n    {\n      \"name\": \"Official Trailer\"\
        ,\n      \"site\": \"YouTube\",\n      \"type\": \"Trailer\",\n      \"official\": true,\n      \"key\": \"BdJKm16Co6M\"\
        \n    }\n  ]\n}\n\n ```\n\n## Response fields\n\n| Field | Description |\n| --- | --- |\n| id | Unique movie identifier
        |\n| results | Array of video objects |\n| key | Unique video identifier on the hosting platform |\n| site | Video
        hosting platform (e.g., YouTube, Vimeo) |\n| type | Type of video asset |\n| name | Video title |\n| official | Indicates
        whether the video is an official release |\n| published_at | Date the video was published |\n| iso_639_1 | Language
        code |\n| iso_3166_1 | Region code |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example
        response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\":
        false, \"status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified
        movie_id does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id
        is correct.  <br>\\* Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n\
        ## Common use cases\n\n- Displaying movie trailers\n    \n- Embedding promotional videos\n    \n- Building media galleries\n\
        \    \n- Enhancing movie detail pages\n    \n- Supporting content discovery and marketing features\n    \n\n## Notes\n\
        \nThe endpoint returns metadata about videos, not the video files themselves. Applications can use the returned `key`
        and `site` values to construct links or embedded players for supported platforms uch as YouTube and Vimeo.\n\nFor
        example, when:\n\n``` json\n{\n  \"site\": \"YouTube\",\n  \"key\": \"BdJKm16Co6M\"\n}\n\n ```\n\nthe video can be
        accessed using:\n\n```\nhttps://www.youtube.com/watch?v=BdJKm16Co6M\n\n ```\n\n## Difference between Videos and Images\n\
        \n### Videos\n\n- Trailers\n    \n- Teasers\n    \n- Featurettes\n    \n- Clips\n    \n- Behind-the-scenes footage\n\
        \    \n\n### Images\n\n- Posters\n    \n- Backdrops\n    \n- Logos\n    \n\nUse the **Videos** endpoint for promotional
        and multimedia content, and the **Images** endpoint for visual assets.\n\n**Note:** The `official` field indicates
        whether a video is officially published by the movie's distributor or studio, making it useful when selecting the
        most authoritative trailer or promotional content to display."
      operationId: getMovieVideos
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/watch/providers:
    get:
      summary: Watch Providers
      responses:
        '200':
          description: Watch Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieWatchProvidersResponse'
              example:
                results:
                  US:
                    link: https://www.themoviedb.org/movie/550/watch
                    flatrate:
                      - provider_name: Netflix
                    rent:
                      - provider_name: Amazon Video
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves streaming, rental, and purchase provider information for a movie across supported regions. This
        endpoint enables applications to display where users can watch, rent, or buy a movie based on their location.\n\n\
        ## Path parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| movie_id | Integer
        | Yes | The unique identifier of the movie. |\n\n## Availability types\n\nThe response categorizes providers into
        different viewing options:\n\n| Type | Description |\n| --- | --- |\n| flatrate | Available through a subscription
        service |\n| rent | Available for rental |\n| buy | Available for purchase |\n\n### Example request\n\n```\n{{base_url}}/movie/{{movie_id}}/watch/providers\n\
        \n ```\n\n### Example response\n\n``` json\n{\n  \"results\": {\n    \"US\": {\n      \"link\": \"https://www.themoviedb.org/movie/550/watch\"\
        ,\n      \"flatrate\": [\n        {\n          \"provider_name\": \"Netflix\"\n        }\n      ],\n      \"rent\"\
        : [\n        {\n          \"provider_name\": \"Amazon Video\"\n        }\n      ]\n    }\n  }\n}\n\n ```\n\n## Response
        fields\n\n| Field | Description |\n| --- | --- |\n| id | Unique movie identifier |\n| results | Region-specific watch
        provider information |\n| link | TMDB link to provider details |\n| flatrate | Subscription streaming providers |\n\
        | rent | Rental providers |\n| buy | Purchase providers |\n| provider_id | Unique provider identifier |\n| provider_name
        | Name of the streaming service |\n| logo_path | Path to the provider logo |\n| display_priority | Provider display
        order |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes**
        | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"\
        status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.\
        \  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\ *
        Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n## Common use cases\n\n\
        - Displaying \"Where to Watch\" sections\n    \n- Building streaming availability features\n    \n- Comparing viewing
        options across regions\n    \n- Supporting content discovery applications\n    \n- Directing users to streaming platforms\n\
        \    \n\n## Notes\n\n> Watch provider availability varies by country and region. A movie may be available on different
        streaming services depending on the user's location. \n  \n> Not all movies have watch provider information available
        for every supported region. \n  \n\n## Understanding regional results\n\nThe response is grouped by country codes:\n\
        \n| Code | Region |\n| --- | --- |\n| US | United States |\n| GB | United Kingdom |\n| CA | Canada |\n| AU | Australia
        |\n\nFor example:\n\n```json\n{\n  \"results\": {\n    \"US\": {\n      \"link\": \"https://www.themoviedb.org/movie/550/watch\"\
        ,\n      \"flatrate\": [\n        {\n          \"provider_name\": \"Netflix\"\n        }\n      ]\n    },\n    \"\
        GB\": {\n      \"link\": \"https://www.themoviedb.org/movie/550/watch\",\n      \"rent\": [\n        {\n         \
        \ \"provider_name\": \"Amazon Video\"\n        }\n      ]\n    }\n  }\n}\n\n ```\n\nThis indicates that provider availability
        differs between the United States and the United Kingdom.\n\n## Difference between Movie Details and Watch Providers\n\
        \n### Movie Details\n\nReturns:\n\n- Title\n    \n- Overview\n    \n- Genres\n    \n- Release date\n    \n- Ratings\n\
        \    \n\n### Watch Providers\n\nReturns:\n\n- Streaming services\n    \n- Rental platforms\n    \n- Purchase options\n\
        \    \n- Regional availability\n    \n\nUse this endpoint when users need to know **where a movie can be watched**,
        rather than information about the movie itself.\n\n**Note:** Watch provider availability is region-specific. Applications
        should inspect the country code within the response and display provider information relevant to the user's location."
      operationId: getMovieWatchProviders
      parameters: []
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/rating:
    post:
      summary: Add Rating
      responses:
        '200':
          description: Add Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieRatingResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Submits a user or guest rating for a movie. Ratings must be between 0.5 and 10.0 and require either a
        valid session ID or a guest session ID for authentication.\n\n## Path parameters\n\n| Parameter | Type | Required
        | Description |\n| --- | --- | --- | --- |\n| movie_id | Integer | Yes | The unique identifier of the movie to rate.
        |\n\n## Query parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| session_id
        | String | Yes | User session identifier required for authenticated ratings. |\n| guest_session_id | String | Yes
        | Guest session identifier required when submitting a guest rating. |\n\n**Note:** Provide either `session_id` or
        `guest_session_id`, depending on the authentication method being used.\n\n## Request body\n\n``` json\n{\n  \"value\"\
        : 8.5\n}\n\n ```\n\n### Body parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | ---
        |\n| value | Number | Yes | Rating value between 0.5 and 10.0 in increments of 0.5. |\n\n## Example request\n\n```http\n\
        POST {{base_url}}/movie/{{movie_id}}/rating?session_id={{session_id}}\n\n ```\n\n``` json\n{\n  \"value\": 8.5\n}\n\
        \n ```\n\n## Successful response\n\n``` json\n{\n  \"success\": true,\n  \"status_code\": 1,\n  \"status_message\"\
        : \"Success.\"\n}\n\n ```\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response
        | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"\
        status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id
        does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.\
        \  <br>\\* Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n## Common use
        cases\n\nThis endpoint can be used to achieve the following:\n\n- Allow users to rate movies\n    \n- Collect audience
        feedback\n    \n- Personalize recommendations\n    \n- Track user preferences\n    \n- Support review and rating systems\n\
        \    \n\n## Authentication\n\n| Requirement | Value |\n| --- | --- |\n| Bearer Token | Recommended |\n| Session ID
        | Required for authenticated ratings |\n| Guest Session ID | Required for guest ratings |\n\nThis endpoint requires
        user authentication and performs a write operation.\n\n## Notes\n\nRatings must be submitted in increments of **0.5**
        and fall within the range **0.5 to 10.0**.\n\nExamples of valid ratings:\n\n```\n0.51.05.58.09.510.0\n\n ```\n\nExamples
        of invalid ratings:\n\n```\n04.310.511\n\n ```\n\n## Related endpoints\n\n| Endpoint | Purpose |\n| --- | --- |\n\
        | `/movie/{movie_id}/account_states` | Retrieve the current user's rating for a movie |\n| `/authentication/session/new`
        | Create a user session |\n| `/authentication/guest_session/new` | Create a guest session |\n\n**Note:** Unlike most
        movie endpoints that retrieve data, this endpoint modifies user-specific data and therefore requires authentication
        through a valid session or guest session. This makes it part of TMDB's authenticated workflow rather than its public
        data retrieval APIs."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: number
              required:
                - value
            example:
              value: 8.5
        required: true
      operationId: addMovieRating
      parameters:
        - name: guest_session_id
          in: query
          schema:
            type: string
          example: '{{guest_session_id}}'
          required: false
          description: Guest session identifier. Use this for guest requests. Provide either guest_session_id or 
            session_id, not both.
        - name: session_id
          in: query
          schema:
            type: string
          example: '{{session_id}}'
          required: false
          description: User session identifier. Use this for authenticated-user requests. Provide either session_id or 
            guest_session_id, not both.
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
    delete:
      summary: Delete Rating
      responses:
        '200':
          description: Delete Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieRatingResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "## Description\n\n> Deletes a previously submitted movie rating. \n  \n\n## Authentication\n\n| Requirement
        | Value |\n| --- | --- |\n| Bearer Token | Recommended |\n| Session ID | Required for authenticated users |\n| Guest
        Session ID | Required for guest users |\n\nThis endpoint requires authentication and performs a write operation by
        modifying user-specific data.\n\n## Notes\n\n> Only the user or guest session that created the rating can delete it.
        After a rating is removed, it will no longer appear in the user's account details for that movie. \n  \n\n## Path
        parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| movie_id | Integer | Yes
        | The unique identifier of the movie whose rating should be removed. |\n\n## Query parameters\n\n| Parameter | Type
        | Required | Description |\n| --- | --- | --- | --- |\n| session_id | String | Yes | User session identifier used
        to authenticate the request. |\n| guest_session_id | String | Yes | Guest session identifier used to authenticate
        the request. |\n\n**Note:** Provide either `session_id` or `guest_session_id`, depending on how the rating was originally
        created.\n\n## Example request\n\n```\nDELETE {{base_url}}/movie/{{movie_id}}/rating?session_id={{session_id}}\n\n\
        \ ```\n\n## Successful response\n\n``` json\n{\n  \"success\": true,\n  \"status_code\": 13,\n  \"status_message\"\
        : \"The item/record was deleted successfully.\"\n}\n\n ```\n\n## Endpoint-specific error\n\n| **Error status** | **Description**
        | Example response | **Possible causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"\
        success\": false, \"status_code\": 34, \"status_message\": \"The resource you requested could not be found.\" }` |
        \\* The specified movie_id does not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify
        that the movie_id is correct.  <br>\\ * Use the Search Movies endpoint to retrieve a valid movie ID before making
        the request. |\n\n## Common use cases\n\n- Allowing users to remove ratings\n    \n- Updating user preferences\n \
        \   \n- Resetting movie feedback\n    \n- Managing account activity\n    \n- Supporting rating management features\n\
        \    \n\n## Related endpoints\n\n| Endpoint | Purpose |\n| --- | --- |\n| `/movie/{movie_id}/rating` (POST) | Create
        or update a movie rating |\n| `/movie/{movie_id}/account_states` | Retrieve the current user's rating status |\n|
        `/authentication/session/new` | Create a user session |\n| `/authentication/guest_session/new` | Create a guest session
        |\n\n**Note:** This endpoint follows the REST principle of resource deletion. While `POST /movie/{movie_id}/rating`
        creates or updates a rating, `DELETE /movie/{movie_id}/rating` removes the rating entirely from the user's account
        history."
      operationId: deleteMovieRating
      parameters:
        - name: guest_session_id
          in: query
          schema:
            type: string
          example: '{{guest_session_id}}'
          required: false
          description: Guest session identifier. Use this for guest requests. Provide either guest_session_id or 
            session_id, not both.
        - name: session_id
          in: query
          schema:
            type: string
          example: '{{session_id}}'
          required: false
          description: User session identifier. Use this for authenticated-user requests. Provide either session_id or 
            guest_session_id, not both.
