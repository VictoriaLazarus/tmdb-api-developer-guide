          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/release_dates:
    get:
      summary: Release Dates
      responses:
        '200':
          description: Release Dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieReleaseDatesResponse'
              example:
                id: 550
                results:
                  - iso_3166_1: US
                    release_dates:
                      - certification: R
                        release_date: '1999-10-15T00:00:00.000Z'
                        type: 3
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the release information for a specific movie across different countries and distribution channels.\n\
        \n# Path parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer
        | Yes | The unique TMDB identifier of the movie. |\n\n# Release types\n\nTMDB classifies releases using the following
        numeric values:\n\n| Type | Release type | Description |\n| --- | --- | --- |\n| `1` | Premiere | Initial premiere
        at a festival or special event before general release. |\n| `2` | Theatrical (Limited) | Limited theatrical release
        in selected cinemas. |\n| `3` | Theatrical | Wide theatrical release. |\n| `4` | Digital | Released through digital
        streaming or online purchase/rental platforms. |\n| `5` | Physical | Released on physical media such as DVD or Blu-ray.
        |\n| `6` | TV | Broadcast on television. |\n\n# Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/release_dates\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"id\": 550,\n  \"results\": [\n    {\n      \"iso_3166_1\"\
        : \"US\",\n      \"release_dates\": [\n        {\n          \"certification\": \"R\",\n          \"release_date\"\
        : \"1999-10-15T00:00:00.000Z\",\n          \"type\": 3\n        }\n      ]\n    }\n  ]\n}\n\n ```\n\n# Response fields\n\
        \n| Field | Description |\n| --- | --- |\n| `id` | Unique TMDB movie identifier. |\n| `results` | Array of country-specific
        release information. |\n| `iso_3166_1` | ISO 3166-1 country code representing the release region. |\n| `release_dates`
        | Array of release records for the country. |\n| `certification` | Age rating or content certification assigned in
        that country. |\n| `release_date` | Official release date and time. |\n| `type` | Numeric identifier representing
        the release format. |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible
        causes** | Solution |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\"\
        : 34, \"status_message\": \"The resource you requested could not be found.\" }` | \\* The specified movie_id does
        not exist.  <br>\\* The movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct. \
        \ <br>\\* Use the Search Movies endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use
        cases\n\n- Display country-specific release dates.\n    \n- Show regional age ratings.\n    \n- Build localized movie
        catalogs.\n    \n- Track theatrical, digital, television, and physical releases.\n    \n- Determine when a movie became
        available in a particular market.\n    \n- Support international release schedules.\n    \n\n# Understanding release
        dates\n\nA movie may have multiple release records because:\n\n- It can be released in different countries on different
        dates,\n    \n- It may have multiple release formats (theatrical, digital, TV, physical),\n    \n- Each country applies
        its own content certification.\n    \n\nFor example:\n\n| Country | Release type | Release date | Certification |\n\
        | --- | --- | --- | --- |\n| United States | Theatrical | October 15, 1999 | R |\n| United Kingdom | Digital | November
        1, 1999 | 18 |\n| Canada | Physical | December 1, 1999 | 18A |\n\nEach of these appears as a separate release record.\n\
        \n# Certification vs. release type\n\n| Field | Purpose |\n| --- | --- |\n| `certification` | Indicates the content
        rating assigned by a country's rating authority (for example, **R**, **PG-13**, or **18**). |\n| `type` | Indicates
        **how** the movie was released, such as theatrical, digital, television, or physical media. |\n\nFor example:\n\n\
        ``` json\n{\n  \"certification\": \"PG-13\",\n  \"type\": 4\n}\n\n ```\n\nThis means that the movie received a **PG-13**
        content rating, and this particular release record represents its **digital release**.\n\nTip: If your application
        only needs the movie's primary release date, use the **Get Movie Details** endpoint. Use **Get Release Dates** when
        you need comprehensive release information across multiple countries, release channels, or content rating systems.
        But keep in mind that a **single country can contain multiple release records.** For example, the United States may
        have separate entries for a limited theatrical release, a wide theatrical release, a digital release, and a physical
        media release."
      operationId: getMovieReleaseDates
      parameters: []
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/reviews:
    get:
      summary: Reviews
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieReviewResponse'
              example:
                id: 550
                page: 1
                results:
                  - author: JohnDoe
                    content: An outstanding film with excellent performances and storytelling.
                    created_at: '2024-01-15T10:30:00.000Z'
                    author_details:
                      rating: 9
                total_pages: 1
                total_results: 1
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves user-submitted reviews for a movie, including review content, author information, ratings, and
        publication metadata.\n\n## Path parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- |
        --- |\n| movie_id | Integer | Yes | The unique identifier of the movie. |\n\n## Query parameters\n\n| Parameter |
        Type | Required | Description |\n| --- | --- | --- | --- |\n| page | Integer | No | Specifies the page of review results
        to retrieve. |\n| language | String | No | Specifies the language of the returned content. |\n\n## Author details\n\
        \nThe response may include additional information about the reviewer:\n\n| Field | Description |\n| --- | --- |\n\
        | username | TMDB username |\n| avatar_path | User profile image path |\n| rating | Rating assigned by the reviewer
        |\n\n### Example request\n\n```\n{{base_url}}/movie/{{movie_id}}/reviews\n\n ```\n\n### Example response\n\n``` json\n\
        {\n  \"author\": \"JohnDoe\",\n  \"content\": \"An outstanding film with excellent performances and storytelling.\"\
        ,\n  \"created_at\": \"2024-01-15T10:30:00.000Z\",\n  \"author_details\": {\n    \"rating\": 9\n  }\n}\n\n ```\n\n\
        ## Response fields\n\n| Field | Description |\n| --- | --- |\n| id | Unique movie identifier |\n| page | Current page
        of results |\n| results | Array of review objects |\n| total_pages | Total number of result pages |\n| total_results
        | Total number of reviews |\n| author | Name of the review author |\n| content | Review text |\n| created_at | Date
        the review was created |\n| updated_at | Date the review was last updated |\n| url | URL to the review on TMDB |\n\
        \n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies
        endpoint to retrieve a valid movie ID before making the request. |\n\n## Common use cases\n\n- Displaying audience
        reviews\n    \n- Building movie review sections\n    \n- Analyzing user sentiment\n    \n- Enhancing movie recommendation
        systems\n    \n- Providing social proof and community feedback\n    \n\n## Note\n\n> A movie may have multiple reviews
        that may differ from the movie's overall average rating. \n  \n\n### Difference between reviews and ratings\n\n**Reviews**\n\
        \n- Contain written feedback and opinions\n    \n- May include an optional rating\n    \n- Provide detailed audience
        perspectives\n    \n\n**Ratings**\n\n- Consists solely of numerical scores\n    \n- Do not include written commentary\n\
        \    \n- Are aggregated into the movie's overall rating\n    \n\n**Note:** The Reviews endpoint returns detailed written
        feedback from users, whereas the movie's `vote_average` and `vote_count` fields provide aggregated rating statistics
        without review content."
      operationId: getMovieReviews
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/similar:
    get:
      summary: Similar
      responses:
        '200':
          description: Similar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSimilarMovieResponse'
              example:
                page: 1
                results:
                  - id: 807
                    title: Se7en
                    release_date: '1995-09-22'
                    vote_average: 8.3
                total_pages: 1
                total_results: 1
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves movies that share similar characteristics with a specified movie.\n\n## Path parameters\n\n\
        | Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| movie_id | Integer | Yes | The unique
        identifier of the movie. |\n\n## Query parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- |
        --- | --- |\n| page | Integer | No | Specifies the page of results to retrieve. |\n| language | String | No | Specifies
        the language of the returned content. |\n\n### Example request\n\n```\nGET {{base_url}}/movie/{{movie_id}}/similar\n\
        \n ```\n\n### Example response\n\n``` json\n{  \"page\": 1,  \"results\": [    {      \"id\": 807,      \"title\"\
        : \"Se7en\",      \"release_date\": \"1995-09-22\",      \"vote_average\": 8.4    }  ]}\n\n ```\n\n## Response fields\n\
        \n| Field | Description |\n| --- | --- |\n| page | Current page of results |\n| results | Array of similar movies
        |\n| total_pages | Total number of result pages |\n| total_results | Total number of similar movies |\n| id | Movie
        identifier |\n| title | Movie title |\n| overview | Movie synopsis |\n| release_date | Official release date |\n|
        popularity | Popularity score |\n| vote_average | Average user rating |\n| vote_count | Number of user ratings |\n\
        \n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\ * Use the Search
        Movies endpoint to retrieve a valid movie ID before making the request. |\n\n## Common use cases\n\n- Building \"\
        Similar Movies\" sections\n    \n- Enhancing content discovery\n    \n- Generating movie recommendations based on
        content attributes\n    \n- Improving user engagement\n    \n- Creating related-content experiences\n    \n\nNote:
        Similar movies are selected based on shared metadata and content characteristics rather than user behavior. Results
        may include movies with comparable genres, themes, settings, or storytelling elements.\n\n## Difference between Similar
        and Recommendations\n\n### Similar movies\n\n- Based primarily on content similarity\n    \n- Uses shared genres,
        keywords, themes, cast, or other metadata\n    \n- Focuses on finding closely related content\n    \n\n### Recommendations\n\
        \n- Generated by TMDB's recommendation algorithms\n    \n- Influenced by user engagement and viewing patterns\n  \
        \  \n- Focuses on content discovery and personalization\n    \n\nFor example, if a user requests similar movies for
        _Fight Club_, the results may include films with comparable themes, tone, or subject matter. Recommendations, however,
        may include movies frequently associated with _Fight Club_ by TMDB users, even if they are not closely related in
        genre or plot.\n\n**Note:** Unlike the Recommendations endpoint, which may be influenced by user engagement and recommendation
        algorithms, the Similar Movies endpoint focuses on content-based relationships between movies."
      operationId: getSimilarMovies
      parameters:
        - name: language
          in: query
          schema:
            type: string
            default: en-US
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
  /movie/{movie_id}/translations:
    get:
      summary: Translations
      responses:
        '200':
          description: Translations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieTranslationsResponse'
              example:
                id: 550
                translations:
                  - iso_639_1: fr
                    iso_3166_1: FR
                    english_name: French
                    name: Français
                    data:
                      title: Fight Club
                      overview: Un employé de bureau...
                      tagline: '...'
                      homepage: https://example.com
      tags:
        - Movies
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves all available translations for a specific movie.\n\n# Path parameters\n\n| Parameter | Type
        | Required | Description |\n| --- | --- | --- | --- |\n| `movie_id` | Integer | Yes | The unique TMDB identifier of
        the movie. |\n\n# Example request\n\n``` http\nGET {{base_url}}/movie/{{movie_id}}/translations\n\n ```\n\n# Example
        success response\n\n``` json\n{\n  \"id\": 550,\n  \"translations\": [\n    {\n      \"iso_639_1\": \"fr\",\n    \
        \  \"iso_3166_1\": \"FR\",\n      \"english_name\": \"French\",\n      \"name\": \"Français\",\n      \"data\": {\n\
        \        \"title\": \"Fight Club\",\n        \"overview\": \"Un employé de bureau...\",\n        \"tagline\": \"...\"\
        ,\n        \"homepage\": \"https://...\"\n      }\n    }\n  ]\n}\n\n ```\n\nNote: This endpoint enables applications
        to discover every language and region in which movie metadata is available, making it ideal for multilingual and internationalized
        applications.\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n| `id` | Unique TMDB movie identifier.
        |\n| `translations` | Array of available translations for the movie. |\n| `iso_639_1` | ISO 639-1 language code. |\n\
        | `iso_3166_1` | ISO 3166-1 country or region code. |\n| `english_name` | Language name in English. |\n| `name` |
        Native language name. |\n| `data.title` | Localized movie title. |\n| `data.overview` | Localized movie overview.
        |\n| `data.tagline` | Localized movie tagline. |\n| `data.homepage` | Localized homepage URL, if available. |\n\n\
        ## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified movie_id does not exist.  <br>\\* The
        movie_id is invalid or incorrectly formatted. | \\* Verify that the movie_id is correct.  <br>\\* Use the Search Movies
        endpoint to retrieve a valid movie ID before making the request. |\n\n# Common use cases\n\n- Build multilingual applications.\n\
        \    \n- Display localized movie titles and descriptions.\n    \n- Support users across different countries and languages.\n\
        \    \n- Populate language selectors in applications.\n    \n- Manage localized movie metadata.\n    \n- Determine
        which translations are available before requesting localized movie details.\n    \n\n# Understanding language and
        region codes\n\nEach translation is identified by both a language and region code.\n\n| Field | Example | Description
        |\n| --- | --- | --- |\n| `iso_639_1` | `en` | ISO 639-1 language code. |\n| `iso_3166_1` | `US` | ISO 3166-1 country
        or region code. |\n\nExamples:\n\n| Locale | Description |\n| --- | --- |\n| `en-US` | English (United States) |\n\
        | `en-GB` | English (United Kingdom) |\n| `fr-FR` | French (France) |\n| `es-ES` | Spanish (Spain) |\n\nAlthough two
        locales may share the same language, their localized content can differ based on regional conventions.\n\n# Translation
        availability\n\nA movie may have multiple translations available, each representing a different language or regional
        variation.\n\nSome translations include:\n\n- Localized titles,\n    \n- Translated overviews,\n    \n- Localized
        taglines,\n    \n- Localized homepage URLs.\n    \n\nOthers may contain only a subset of these fields. Applications
        should not assume that every translation contains complete metadata.\n\n# Translations vs. `language` query parameter\n\
        \nAlthough both approaches support localization, they serve different purposes.\n\n| Translations endpoint | `language`
        query parameter |\n| --- | --- |\n| Returns **all available translations** for a movie. | Returns movie details in
        **one requested language**. |\n| Used to discover available languages. | Used to retrieve localized content for a
        specific locale. |\n| Supports multilingual applications. | Supports displaying content for a user's selected language.
        |\n| Returns translation metadata for multiple locales in a single response. | Returns only one localized version
        of the movie details. |\n\nFor example:\n\n``` http\nGET /movie/550/translations\n\n ```\n\nreturns every available
        translation.\n\nWhereas:\n\n``` http\nGET /movie/550?language=fr-FR\n\n ```\n\nreturns the movie details only in French
        (if available).\n\nTip: Use this endpoint to **discover which translations are available** for a movie. Once you've
        identified the language you need, you can request the **Movie Details** endpoint with the corresponding `language`
        query parameter to retrieve a localized version of the movie metadata."
      operationId: getMovieTranslations
      parameters: []
    parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{movie_id}}'
