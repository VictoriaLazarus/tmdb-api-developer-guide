      summary: Similar
      description: |-
        Retrieves movies that share similar characteristics with a specified movie.

        ## Common use cases

        - Building "Similar Movies" sections
        - Enhancing content discovery
        - Generating movie recommendations based on content attributes
        - Improving user engagement
        - Creating related-content experiences

        ## Difference between Similar and Recommendations

        ### Similar movies

        - Based primarily on content similarity
        - Uses shared genres, keywords, themes, cast, or other metadata
        - Focuses on finding closely related content

        ### Recommendations

        - Generated by TMDB's recommendation algorithms
        - Influenced by user engagement and viewing patterns
        - Focuses on content discovery and personalization

        For example, if a user requests similar movies for _Fight Club_, the results may include films with comparable themes, tone, or subject matter. Recommendations, however, may include movies frequently associated with _Fight Club_ by TMDB users, even if they are not closely related in genre or plot.

        ## Notes

        Unlike the Recommendations endpoint, which may be influenced by user engagement and recommendation algorithms, the Similar Movies endpoint focuses on content-based relationships between movies.
