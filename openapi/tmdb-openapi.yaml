        | `abc123...` |\n| `language` | String | No | Specifies the language used for localized movie information. | `en-US`
        |\n| `page` | Integer | No | Specifies the page of results to retrieve. | `1` |\n| `sort_by` | String | No | Specifies
        how the results should be sorted. | `created_at.asc` |\n\n# Example request\n\n```\nGET {{base_url}}/account/{{account_id}}/favorite/movies?session_id={{session_id}}&language=en-US&page=1\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 550,\n\
        \      \"title\": \"Fight Club\",\n      \"overview\": \"A ticking-time-bomb insomniac...\",\n      \"release_date\"\
        : \"1999-10-15\",\n      \"vote_average\": 8.4,\n      \"popularity\": 89.7,\n      \"poster_path\": \"/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg\"\
        \n    }\n  ],\n  \"total_pages\": 1,\n  \"total_results\": 1\n}\n\n ```\n\n# Response fields\n\n| Field | Description
        |\n| --- | --- |\n| `page` | Current page of the paginated results. |\n| `results` | Array of the user's favorite
        movies. |\n| `id` | Unique TMDB movie identifier. |\n| `title` | Movie title. |\n| `overview` | Brief synopsis of
        the movie. |\n| `release_date` | Official release date. |\n| `vote_average` | Average user rating. |\n| `popularity`
        | TMDB popularity score. |\n| `poster_path` | Relative path to the movie poster image. |\n| `total_pages` | Total
        number of available result pages. |\n| `total_results` | Total number of favorite movies. |\n\n## Endpoint-specific
        error\n\n| **Error status** | **Description** | Example Response | **Possible causes** | Solution |\n| --- | --- |
        --- | --- | --- |\n| 401 | Unauthorized | `{`  <br>`success\": false, \"status_code\": 3, \"status_message\": \"Authentication
        failed: You do not have permissions to access the service.\" }` | \\* The session_id is invalid or has expired.  <br>\\
        * The session_id does not belong to the specified account.  <br>\\* The Bearer token is missing or invalid. | \\*
        Verify that a valid session_id is included in the request.  <br>\\* Ensure the session_id was created through the
        TMDB authentication workflow.  <br>\\ * Confirm that the supplied account_id corresponds to the authenticated session.
        |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\": \"The resource you requested
        could not be found.\" }` | \\* The specified account_id does not exist.  <br>\\* The account_id is invalid or incorrectly
        formatted. | Retrieve the correct account_id from the Authentication collection before retrying the request. |\n\n\
        # Common use cases\n\n- Display a user's favorite movies.\n    \n- Synchronize favorite movies across multiple devices.\n\
        \    \n- Build personalized movie recommendation features.\n    \n- Allow users to browse and manage their saved favorites.\n\
        \    \n- Populate a **My Favorite Movies** section in an application.\n    \n\n# Note\n\n- Results are returned in
        a paginated format.\n    \n- Only movies that the authenticated user has marked as favorites are returned.\n    \n\
