      description: "Retrieves the custom lists created by an authenticated TMDB user. Custom lists allow users to organize
        movies into personalized collections based on their own themes, interests, or criteria.\n\n# Prerequisites\n\nBefore
        calling this endpoint, ensure that you have:\n\n1. Completed the TMDB authentication workflow.\n    \n2. Obtained
        a valid `session_id`.\n    \n3. Retrieved the authenticated user's `account_id`.\n    \n\n# Path parameters\n\n| Parameter
        | Type | Required | Description |\n| --- | --- | --- | --- |\n| `account_id` | Integer | Yes | The unique identifier
        of the authenticated TMDB account. |\n\n# Query parameters\n\n| Parameter | Type | Required | Description | Example
        |\n| --- | --- | --- | --- | --- |\n| `session_id` | String | Yes | The authenticated user's session identifier. |
        `abc123...` |\n| `page` | Integer | No | Specifies the page of results to retrieve. | `1` |\n\n# Example request\n\
        \n```\nGET {{base_url}}/account/{{account_id}}/lists?session_id={{session_id}}&page=1\n\n ```\n\n# Example success
        response\n\n``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 82145,\n      \"name\": \"Classic
        Thrillers\",\n      \"description\": \"A collection of my favorite thriller movies.\",\n      \"item_count\": 18,\n\
        \      \"public\": true\n    }\n  ],\n  \"total_pages\": 1,\n  \"total_results\": 1\n}\n\n ```\n\n# Response fields\n\
        \n| Field | Description |\n| --- | --- |\n| `page` | Current page of the paginated results. |\n| `results` | Array
        of custom lists belonging to the authenticated user. |\n| `id` | Unique identifier of the custom list. |\n| `name`
        | Name of the custom list. |\n| `description` | Description provided by the user for the list. |\n| `item_count` |
        Number of movies contained in the list. |\n| `public` | Indicates whether the list is publicly visible. |\n| `total_pages`
        | Total number of available result pages. |\n| `total_results` | Total number of custom lists. |\n\n## Endpoint-specific
        error\n\n| **Error status** | **Description** | Example Response | **Possible causes** | Solution |\n| --- | --- |
        --- | --- | --- |\n| 401 | Unauthorized | `{`  <br>`success\": false, \"status_code\": 3, \"status_message\": \"Authentication
        failed: You do not have permissions to access the service.\" }` | \\* The session_id is invalid or has expired.  <br>\\
        * The session_id does not belong to the specified account.  <br>\\ * The Bearer token is missing or invalid. | \\\
        * Verify that a valid session_id is included in the request.  <br>\\* Ensure the session_id was created through the
        TMDB authentication workflow.  <br>\\* Confirm that the supplied account_id corresponds to the authenticated session.
        |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\": \"The resource you requested
        could not be found.\" }` | \\* The specified account_id does not exist.  <br>\\ * The account_id is invalid or incorrectly
        formatted. | Retrieve the correct account_id from the Authentication collection before retrying the request. |\n\n\
        # Common use cases\n\n- Display a user's custom movie lists.\n    \n- Organize movies into themed or personalized
        collections.\n    \n- Synchronize user-created lists across multiple devices.\n    \n- Retrieve list metadata before
        requesting detailed list contents.\n    \n- Build collection management features within an application.\n    \n\n\
        # Note\n\n- Only custom lists belonging to the authenticated account are returned.\n    \n- Results are returned in
