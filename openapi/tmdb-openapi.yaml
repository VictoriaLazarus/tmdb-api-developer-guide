        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id002
                success: false
                status_code: 34
                status_message: The resource you requested could not be found.
      tags:
        - Account
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Retrieves the public profile information for a specified TMDB account.\n\n## Prerequisite\n\n- Before
        calling this endpoint, ensure you have:\n    \n- Authenticated with the TMDB API using your Bearer token.\n    \n\
        - Completed the authentication workflow to obtain a valid `session_id`.\n    \n- Retrieved your `account_id` using
        the **Get Account Details** endpoint in the **Authentication** collection (`GET /account`).\n    \n- Used the returned
        `account_id` as the path parameter for this endpoint.\n    \n\n> **Note**: This endpoint is typically called after
        the account ID has been obtained and is used to access additional account profile information. \n  \n\n## Path parameter\n\
        \n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| `account_id` | Integer | Yes | The unique
        identifier of the TMDB account whose details are being retrieved. |\n\n# Example request\n\n```\nGET {{base_url}}/account/{{account_id}}?session_id={{session_id}}\n\
        \n ```\n\n# Example success response\n\n``` json\n{\n  \"avatar\": {\n    \"gravatar\": {\n      \"hash\": \"205e460b479e2e5b48aec07710c08d50\"\
        \n    },\n    \"tmdb\": {\n      \"avatar_path\": \"/abc123.jpg\"\n    }\n  },\n  \"id\": 218,\n  \"iso_639_1\": \"\
        en\",\n  \"iso_3166_1\": \"US\",\n  \"name\": \"John Doe\",\n  \"include_adult\": false,\n  \"username\": \"johndoe\"\
        \n}\n\n ```\n\n# Response fields\n\n| Field | Description |\n| --- | --- |\n| `id` | Unique TMDB account identifier.
        |\n| `username` | TMDB username. |\n| `name` | Display name associated with the account. |\n| `avatar` | Avatar information,
        including Gravatar and TMDB avatar details. |\n| `iso_639_1` | Preferred language for the account. |\n| `iso_3166_1`
        | Preferred country or region. |\n| `include_adult` | Indicates whether adult content is enabled for the account.
        |\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example Response | **Possible causes** |
        Solution |\n| --- | --- | --- | --- | --- |\n| 401 | Unauthorized | `{`  <br>`success\": false, \"status_code\": 3,
        \"status_message\": \"Authentication failed: You do not have permissions to access the service.\" }` | \\* The session_id
        is invalid or has expired.  <br>\\* The session_id does not belong to the specified account.  <br>\\ * The Bearer
        token is missing or invalid. | \\* Verify that a valid session_id is included in the request.  <br>\\* Ensure the
        session_id was created through the TMDB authentication workflow.  <br>\\* Confirm that the supplied account_id corresponds
        to the authenticated session. |\n| 404 | Not found | `{ \"success\": false, \"status_code\": 34, \"status_message\"\
        : \"The resource you requested could not be found.\" }` | \\* The specified account_id does not exist.  <br>\\ * The
        account_id is invalid or incorrectly formatted. | Retrieve the correct account_id from the Authentication collection
        before retrying the request. |\n\n# Common use cases\n\n- Retrieve a user's profile information.\n    \n- Obtain account
        preferences such as language and region.\n    \n- Display account details in an application.\n    \n- Verify the authenticated
        account before performing account-specific operations.\n    \n- Retrieve account metadata required by other Account
        endpoints."
      operationId: getAccountDetailsById
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          example: '{{session_id}}'
          required: false
    parameters:
