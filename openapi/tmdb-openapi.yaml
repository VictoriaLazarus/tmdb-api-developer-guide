        \n```\n{{base_url}}/search/keyword?query=superhero&language=en-US&page=1\n\n ```\n\n## Example success response\n\n\
        ``` json\n{\n  \"page\": 1,\n  \"results\": [\n    {\n      \"id\": 9715,\n      \"name\": \"superhero\"\n    }\n\
        \  ],\n  \"total_pages\": 1,\n  \"total_results\": 1\n}\n\n ```\n\n## Response field\n\n| Field | Type | Description
        |\n| --- | --- | --- |\n| `page` | Integer | The current page of search results. |\n| `results` | Array | An array
        containing keywords that match the search query. |\n| `results[].id` | Integer | The unique TMDB identifier of the
        keyword. |\n| `results[].name` | String | The name of the keyword. |\n| `total_pages` | Integer | The total number
        of pages available for the search results. |\n| `total_results` | Integer | The total number of keywords matching
        the search query. |\n\n**Note:** Keywords provide more specific themes, concepts, or descriptive tags than genres.
        For example, you can use`superhero, time travel`, or `space travel` as keywords to describe specific aspects of a
        movie.\n\n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes**
        | Solution |\n| --- | --- | --- | --- | --- |\n| 400 | Bad Request | `{ \"success\": false, \"status_code\": 22, \"\
