  /certification/movie/list:
    get:
      tags:
      - Certifications
      summary: Movie Certifications
      description: |-
        Retrieves the list of official movie certification ratings supported by TMDB.

        ## Common use cases

        - Display movie age ratings in an application.
        - Filter movie results by certification using the **Discover Movies** endpoint.
        - Build parental control or age-restriction features.
        - Interpret certification values returned by movie-related endpoints.
        - Configure region-specific content filtering.

        ## Notes

        - This endpoint does not require a `movie_id`.
        - Certification ratings are grouped by ISO 3166-1 country codes (for example, `US`, `GB`, `DE`, and `FR`).
        - Certification systems vary by country, so the available ratings differ between regions.
        - The returned certification values can be used with endpoints such as **Discover Movies** to filter content based on regional age ratings.

        Tip: This endpoint returns the available movie certification systems used by each country—it does not return the certification assigned to a specific movie.

        For example:

        - Calling this endpoint tells you that the United States uses certifications such as **G**, **PG**, **PG-13**, and **R**.
        - To retrieve the certification assigned to a particular movie, use the **Movie Release Dates** endpoint, which returns country-specific release information along with the movie's certification.
      operationId: getMovieCertifications
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationListResponse'
              example:
                certifications:
                  US:
                  - certification: G
                    meaning: All ages admitted.
                    order: 1
                  - certification: PG
                    meaning: Parental guidance suggested.
                    order: 2
                  - certification: PG-13
                    meaning: Parents strongly cautioned.
                    order: 3
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - Missing or invalid Bearer token.
            - Invalid or revoked API key.
            - Incorrectly formatted Authorization header.

            **How to fix it**

            - Verify that a valid Bearer token or API key is included in the request and that the authentication credentials have not expired or been revoked.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
  /certification/tv/list:
    get:
      tags:
      - Certifications
      summary: TV Certifications
      description: |-
        The **TV Certifications** endpoint retrieves an up-to-date list of officially supported TV show certifications on TMDB.

        A successful request returns a `200 OK` response containing a `certifications` object.

        The `certifications` object is organized by country or region code. Each country contains an array of certification objects.

        ## Prerequisites

        Before calling this endpoint, ensure that you have:

        1. The `base_url` environment variable configured correctly.
        2. The Authorization header configured with your valid Bearer token.

        ## Common use cases

        - Display available TV content ratings.
        - Build a TV certification or parental-control filter.
        - Map TMDB TV certification codes to user-facing descriptions.
        - Retrieve the rating systems supported for different countries or regions.

        ## Notes

        - The endpoint returns certification information rather than individual TV shows.
        - Certification data is grouped by country or region.
        - The certification list may be updated as TMDB updates its supported rating systems.
      operationId: getTVCertifications
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationListResponse'
              example:
                certifications:
                  US:
                  - certification: TV-Y
                    meaning: This program is designed to be appropriate for all children.
                    order: 1
                  - certification: TV-Y7
                    meaning: This program is designed for children age 7 and above.
                    order: 2
                  - certification: TV-G
                    meaning: Most parents would find this program suitable for all ages.
                    order: 3
  /search/collection:
