openapi: 3.0.0
info:
  title: TMDB API
  version: '3.0'
  description: |-
    The TMDB API gives you access to movie, television, person, and account data over HTTP.

    Every request on this page runs against the live TMDB v3 API. Add your API Read Access Token in the **Authorization** panel to try any endpoint directly from the browser.

    New here? Start with [Getting started](/getting-started/prerequisites), then [Authentication](/authentication/overview).
  contact:
    name: TMDB API support
    url: https://www.themoviedb.org/talk/category/5047958519c29526b50017d6
  license:
    name: TMDB API Terms of Use
    url: https://www.themoviedb.org/api-terms-of-use
servers:
- url: https://api.themoviedb.org/3
  description: TMDB API v3 production server
tags:
- name: Authentication
  description: Create and manage the request tokens, user sessions, and guest sessions that authorize
    user-specific requests. Start here before calling any account endpoint.
- name: Account
  description: Read account details and manage the favorites, watchlists, ratings, and lists that belong
    to an authenticated TMDB user. Every endpoint in this group requires a v3 session ID.
- name: Search
  description: Find movies, TV shows, people, collections, companies, and keywords by text query. Use
    Search when you have a title or name; use Discover when you have filters.
- name: Discover
  description: Build filtered, sorted result sets without a search term. Combine genre, rating, language,
    certification, provider, and date filters to power browse and recommendation surfaces.
- name: Movies
  description: Retrieve movie details, credits, images, videos, keywords, reviews, release dates, translations,
    watch providers, recommendations, and ratings.
- name: Networks
  description: Look up television network details, images, and alternative names.
- name: Certifications
  description: Retrieve the official movie and TV content rating systems used in each country.
paths:
  /authentication/validate_key:
    get:
      tags:
      - Authentication
      summary: Validate key
      description: |-
        Validates your TMDB API credentials by confirming that the supplied API key or access token is recognized and authorized to access the TMDB API.

        > Note: You only need your Bearer token or API key for this endpoint.

        ## Common use cases

        - Verify API credentials during application setup.
        - Confirm that an API key or access token is valid.
        - Test API connectivity before making authenticated requests.
        - Troubleshoot authentication or configuration issues.
        - Validate credentials in automated deployment or CI/CD pipelines before running API-dependent tasks.

        ## Notes

        This endpoint only validates your API credentials. It does not create a user session or authenticate a TMDB user account.
      operationId: validateApiKey
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationValidationResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - Incorrect API key.
            - API key has been revoked.
            - Missing Authorization header.
            - Typographical error in the API key.

            **How to fix it**

            - Verify that the API key is correct.
            - Ensure the Bearer token is valid.
            - Check that the request is sent to the correct API version.
            - Confirm that the Authorization header is properly formatted.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 7
                status_message: 'Invalid API key: You must be granted a valid key.'
  /authentication/token/new:
    get:
      tags:
      - Authentication
      summary: Create Request Token
      description: |-
        Generates a temporary request token used in the TMDB user authentication workflow.

        > Note: You only need your Bearer token or API key for this endpoint.

        ## Common use cases

        - Start the TMDB user authentication workflow.
        - Obtain user authorization before creating a session.
        - Enable access to user-specific endpoints such as Favorites, Watchlists, Ratings, and Account Details.
        - Authenticate users in applications that require personalized TMDB features.

        ## Authentication workflow

        After generating a request token:

        1. Open the following URL in your preferred browser:

        ```
        https://www.themoviedb.org/authenticate/{request_token}
        ```

        Replace `{request_token}` with the value returned by this endpoint.

        1. Sign in to TMDB (if prompted).
        2. Select **Approve** to authorize your application.
        3. Use the validated request token to create a user session.

        ## Notes

        - A request token **must be approved** before it can be exchanged for a session ID.
        - The approval step can be completed in a web browser.
        - The request token expires after a period of time. If this happens before approval or session creation, generate a new one.
        - An unapproved or expired request token cannot be used to create a session.

        Also, a request token alone does not authenticate a user. It simply initiates the authentication process.

        The complete workflow is:

        1. Validate API credentials
        2. Create request token
        3. Approve the returned token in a web browser
        4. Create session
        5. Use the session ID to access authenticated endpoints
      operationId: createRequestToken
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTokenResponse'
              example:
                success: true
                expires_at: '{{expires_at}}'
                request_token: '{{request_token}}'
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - Incorrect API key.
            - API key has been revoked.
            - Missing Authorization header.
            - Typographical error in the API key.

            **How to fix it**

            - Verify that the API key is correct.
            - Ensure the Bearer token is valid.
            - Check that the request is sent to the correct API version.
            - Confirm that the Authorization header is properly formatted.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 7
                status_message: 'Invalid API key: You must be granted a valid key.'
  /authentication/session/new:
    post:
      tags:
      - Authentication
      summary: Create Session
      description: |-
        Creates a v3 `session_id` by exchanging a previously validated request token. The returned ID represents an authenticated TMDB user session and is required to access account-specific endpoints.

        > **Note**: This endpoint is the final step in the standard TMDB v3 authentication workflow.

        ## Prerequisites

        Before calling this API, ensure you have:

        - A valid request token generated using the **Create Request Token** endpoint.
        - A request token that has been validated through either:

            - the browser approval flow, or

            - the **Create Session (with Login)** (`validate_with_login`) endpoint.

        - A request token that has not expired or already been exchanged for a session.

        ## Common use cases

        - Complete the TMDB v3 authentication workflow.
        - Create an authenticated user session.
        - Access account-specific endpoints such as Favorites, Watchlists, Ratings, and Account Details.
        - Maintain an authenticated session across multiple API requests.
        - Enable personalized features within an application.

        ## Notes

        **Note:** A `session_id` represents an authenticated TMDB user session. Store it securely and reuse it for subsequent authenticated requests instead of creating a new session for every API call. If the user signs out or the session is no longer needed, invalidate it using the **Delete Session** endpoint.
      operationId: createSession
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_token:
                  type: string
                  description: A validated request token obtained during the authentication workflow.
              required:
              - request_token
            example:
              request_token: '{{request_token}}'
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                success: true
                session_id: '{{session_id}}'
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - The request token is invalid.
            - The request token has expired.
            - The request token has not been approved or validated.
            - The request token has already been exchanged for a session.

            **How to fix it**

            - Generate a new request token if the current one has expired.
            - Validate the request token using either the browser approval flow or the Create Session (with Login) endpoint.
            - Retry the request using a valid, approved request token.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 33
                status_message: Invalid request token.
  /authentication/guest_session/new:
    get:
      tags:
      - Authentication
      summary: Create Guest Session
      description: |-
        Creates a temporary guest session and returns a unique ID that allows users who are not signed in to perform supported actions, such as rating movies and TV shows.

        > Note: Guest sessions are intended for anonymous users and do not provide access to account-specific features such as favorites, watchlists, or account states. Also, guest sessions provide limited permissions and should not be used as a substitute for a standard authenticated user session.

        ## Common use cases

        - Allow anonymous users to rate movies or TV shows.
        - Support temporary user interactions without requiring account registration.
        - Enable quick onboarding experiences by postponing sign-in.
        - Collect ratings from users who do not wish to create a TMDB account.

        ## Guest session vs. standard user session

        | Guest session | Standard user session |
        | --- | --- |
        | Does not require a TMDB account. | Requires a TMDB account and user authentication. |
        | Uses a `guest_session_id`. | Uses a `session_id`. |
        | Supports a limited set of operations, such as rating content. | Supports all authenticated account features. |
        | Cannot access personal account data. | Can access favorites, watchlists, ratings, account states, and custom lists. |
        | Intended for anonymous users. | Intended for authenticated users. |

        The diagram below further expatiates on this:

        <img src="https://content.pstmn.io/4f6e0ea9-a563-46e7-9e29-953d6c9019fa/Xy0gdmlzdWFsIHNlbGVjdGlvbiAoMykucG5n" />
      operationId: createGuestSession
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
              example:
                success: true
                guest_session_id: '{{guest_session_id}}'
                expires_at: '{{expires_at}}'
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - The Bearer token is missing or invalid.
            - The API Read Access Token has been revoked or is incorrectly configured.

            **How to fix it**

            - Verify that the Authorization header contains a valid Bearer token.
            - Confirm that your TMDB API credentials are active and correctly configured.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
  /authentication/session/convert/4:
    post:
      tags:
      - Authentication
      summary: Create Session (from v4 token)
      description: |-
        Creates a v3 `session_id` using a user-authorized v4 access token.

        > **Note:** Unlike the standard **Create Session** endpoint, which exchanges a validated request token for a session, this endpoint creates a v3 session directly from a user-authorized v4 access token. Therefore, it is intended for applications that use the TMDB v4 authentication flow but still need a v3 session to access endpoints that require session-based authentication.

        ## Prerequisites

        Before calling this API, ensure you have:

        - A valid user-authorized v4 access token.
        - A v4 access token with write permission.

        > **Note:** Do not use your standard TMDB **Read Access Token**, as it is intended for application authentication and cannot be exchanged for a v3 session.

        ## Common use cases

        - Convert an authenticated v4 user session into a v3 session.
        - Access v3 endpoints that require a `session_id`.
        - Support applications that integrate both the TMDB v3 and v4 APIs.
        - Reuse an existing authenticated v4 user session without repeating the v3 authentication workflow.

        ## Notes

        - This endpoint is intended for applications using the TMDB v4 authentication workflow.
        - The supplied v4 access token must be authorized and include write permission.
        - A standard TMDB Read Access Token cannot be used to create a v3 session.
        - The returned `session_id` can be used with any v3 endpoint that requires session-based authentication.

        Also, most applications using only the TMDB v3 API do not need this endpoint. Use **Create Session** if you are following the standard v3 authentication workflow. This endpoint is primarily intended for applications that authenticate users through the TMDB v4 API but need to interact with v3 endpoints that require a `session_id`.
      operationId: createSessionFromV4Token
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
              required:
              - access_token
            example:
              access_token: '{{v4_access_token}}'
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                success: true
                session_id: '{{session_id}}'
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - A standard TMDB Read Access Token was supplied instead of a user-authorized v4 access token.
            - The v4 access token has not been granted write permission by the user.
            - The supplied access token is invalid or has expired.

            **How to fix it**

            - Create a new v4 request token.
            - Ask the user to authorize the token through the TMDB authorization flow.
            - Exchange the approved request token for a user-authorized v4 access token.
            - Retry the request using the authorized access token.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 36
                status_message: This token hasn't been granted write permission by the user.
  /authentication/token/validate_with_login:
    post:
      tags:
      - Authentication
      summary: Create Session (with Login)
      description: |-
        Validates a previously generated request token using a TMDB username and password.

        ## Prerequisites

        Before calling this endpoint, ensure you have:

        1. A valid request token generated using the **Create Request Token** endpoint.
        2. A valid TMDB username and password for the user.
        3. A request token that has not expired.

        > **Note**: Once the request token has been successfully validated, it can be exchanged for a v3 session ID, allowing your application to access authenticated, user-specific resources such as account details, favorites, watchlists, ratings, and account states. Unlike the browser-based approval flow, this endpoint validates the request token programmatically by submitting the user's TMDB credentials directly to the API.

        ## Common use cases

        - Validate a request token without redirecting users to the TMDB website.
        - Support server-side authentication workflows.
        - Authenticate users before creating a session.
        - Prepare a validated request token for the **Create Session** endpoint.

        ## Browser approval vs. `validate_with_login`

        Both methods validate a request token before it is exchanged for a session ID.

        | Browser approval | `validate_with_login` |
        | --- | --- |
        | User approves the request token on the TMDB website. | User submits TMDB username and password directly to the API. |
        | No user credentials pass through your application. | User credentials are included in the request body. |
        | May redirect the user to TMDB. | Validation occurs entirely through the API. |
        | Returns a validated request token. | Returns a validated request token. |

        Both approaches produce the same result: a validated request token that can be used to create a session.

        <img src="https://content.pstmn.io/2e4d2b45-5e23-4878-a598-03ee86dbff78/QXV0aGVudGljYXRpb24gd29ya2Zsb3cgLSB2aXN1YWwgc2VsZWN0aW9uICgxKS5wbmc=" width="579" height="272" />

        ## Notes

        - This endpoint **does not create a session ID**.
        - A successfully validated request token must be passed to the **Create Session** endpoint to obtain a `session_id`.
        - If the request token expires before a session is created, generate a new token and repeat the validation process.
        - Once a request token has been successfully exchanged for a session, it cannot be reused.
      operationId: createSessionWithLogin
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The user's TMDB username.
                password:
                  type: string
                  description: The user's TMDB password.
                request_token:
                  type: string
                  description: The request token returned by the Create Request Token endpoint.
              required:
              - username
              - password
              - request_token
            example:
              username: YOUR_USERNAME
              password: YOUR_PASSWORD
              request_token: '{{request_token}}'
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTokenResponse'
              example:
                success: true
                expires_at: '{{expires_at}}'
                request_token: '{{request_token}}'
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - Incorrect TMDB username.
            - Incorrect TMDB password.
            - Expired request token.
            - Request token has already been used or is invalid.

            **How to fix it**

            - Verify the user's TMDB credentials.
            - Generate a new request token if the existing one has expired.
            - Retry the validation request before creating a session.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 30
                status_message: Invalid username and/or password.
  /account:
    get:
      tags:
      - Authentication
      summary: Account Details
      description: |-
        Returns account metadata, including the account identifier required by many account-specific requests.

        > **Note**: Before calling this endpoint, you need a valid `session_id` that has not already expired. The session_id must be generated through the TMDB authentication workflow. Requests made with an invalid or expired session ID will return an authentication error.

        ## Common use cases

        - Retrieve the authenticated user's TMDB `account_id` required for subsequent account-related API requests.
        - Confirm that the authentication workflow has successfully established access to the user's account.
        - Use the returned account information when working with endpoints such as Favorites, Watchlists, Ratings, and Account Details.
      operationId: getAccountDetails
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
        example: '{{session_id}}'
        required: true
        description: The v3 session ID that identifies the authenticated user.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
              example:
                avatar: {}
                id: 12345678
                iso_639_1: en
                iso_3166_1: US
                name: John Doe
                username: johndoe
        '403':
          description: |-
            Forbidden. The credentials are valid but are not permitted to perform this action.

            **Possible causes**

            - Missing or invalid session_id.
            - Missing API key or Bearer token.
            - Incorrect request URL.
            - Temporary CloudFront or routing issue.

            **How to fix it**

            - Verify that the session_id is valid and has not expired.
            - Confirm that the request includes the required authentication.
            - Ensure the request is sent to:
            - GET /3/account

            See [Errors](/errors/overview) for the full list of TMDB status codes.
  /account/{account_id}:
    get:
      tags:
      - Account
      summary: Account Details
      description: |-
        Retrieves the public profile information for a specified TMDB account.

        ## Prerequisites

        - Before calling this endpoint, ensure you have:
        - Authenticated with the TMDB API using your Bearer token.
        - Completed the authentication workflow to obtain a valid `session_id`.
        - Retrieved your `account_id` using the **Get Account Details** endpoint in the **Authentication** collection (`GET /account`).
        - Used the returned `account_id` as the path parameter for this endpoint.

        > **Note**: This endpoint is typically called after the account ID has been obtained and is used to access additional account profile information.

        ## Common use cases

        - Retrieve a user's profile information.
        - Obtain account preferences such as language and region.
        - Display account details in an application.
        - Verify the authenticated account before performing account-specific operations.
        - Retrieve account metadata required by other Account endpoints.
      operationId: getAccountDetailsById
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        description: Your TMDB account ID. Retrieve it from the Get Account Details endpoint.
        schema:
          type: integer
          example: 21857592
      - name: session_id
        in: query
        schema:
          type: string
        example: '{{session_id}}'
        required: false
        description: The v3 session ID that identifies the authenticated user.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
              example:
                avatar:
                  gravatar:
                    hash: 205e460b479e2e5b48aec07710c08d50
                  tmdb:
                    avatar_path: /abc123.jpg
                id: 218
                iso_639_1: en
                iso_3166_1: US
                name: John Doe
                include_adult: false
                username: johndoe
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - The session_id is invalid or has expired.
            - The session_id does not belong to the specified account.
            - The Bearer token is missing or invalid.

            **How to fix it**

            - Verify that a valid session_id is included in the request.
            - Ensure the session_id was created through the TMDB authentication workflow.
            - Confirm that the supplied account_id corresponds to the authenticated session.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id001
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
        '404':
          description: |-
            Not found. TMDB has no resource matching the supplied identifier or path.

            **Possible causes**

            - The specified account_id does not exist.
            - The account_id is invalid or incorrectly formatted.

            **How to fix it**

            - Retrieve the correct account_id from the Authentication collection before retrying the request.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id002
                success: false
                status_code: 34
                status_message: The resource you requested could not be found.
    parameters:
    - name: account_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      example: '{{account_id}}'
  /account/{account_id}/favorite:
    post:
      tags:
      - Account
      summary: Add Favorite
      description: |-
        Adds or removes a movie or TV show from an authenticated user's favorites.

        ## Prerequisites

        Before calling this endpoint, ensure that you have:

        1. Completed the TMDB authentication workflow.
        2. Obtained a valid `session_id`.
        3. Retrieved the authenticated user's `account_id`.
        4. Identified the TMDB ID of the movie or TV show you want to update.

        ## Common use cases

        - Allow users to save favorite movies.
        - Allow users to save favorite TV shows.
        - Build personalized user profiles.
        - Synchronize favorite content across multiple devices.
        - Create "My Favorites" sections within an application.

        ## Notes

        This endpoint is **idempotent** with respect to the `favorite` field. Sending the same request multiple times with the same value (for example, `favorite: true` for an item that is already favorited) does not create duplicate entries. Likewise, setting `favorite` to `false` for an item that is not currently in the favorites list ensures it is not marked as a favorite. By specifying the media type, media identifier, and a boolean value indicating whether the item should be favorited, the endpoint allows applications to manage a user's favorites list.
      operationId: addFavorite
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        description: Your TMDB account ID. Retrieve it from the Get Account Details endpoint.
        schema:
          type: integer
          example: 21857592
      - name: session_id
        in: query
        schema:
          type: string
        example: '{{session_id}}'
        required: true
        description: The authenticated user's session identifier.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                  description: The type of media. Accepted values are `movie` and `tv`.
                media_id:
                  type: integer
                  description: The TMDB identifier of the movie or TV show.
                favorite:
                  type: boolean
                  description: Determines whether the item is added to (`true`) or removed from (`false`)
                    the favorites list.
              required:
              - media_type
              - media_id
              - favorite
            example:
              media_type: movie
              media_id: 550
              favorite: true
        required: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountActionResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
        '400':
          description: |-
            Bad request. TMDB rejected the request because a parameter or value was invalid.

