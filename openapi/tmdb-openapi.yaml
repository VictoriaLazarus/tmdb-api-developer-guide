  /authentication/session:
    delete:
      tags:
      - Authentication
      summary: Delete Session
      description: |-
        Deletes an active v3 session, immediately invalidating the associated `session_id`.

        > **Note**: Before calling this endpoint, ensure that you have a valid `session_id` that has not already expired. Also, once the session has been deleted, it can no longer be used to access authenticated TMDB endpoints that require session-based authentication.

        ## Common use cases

        - Sign a user out of an application.
        - End an authenticated session after account operations are complete.
        - Invalidate sessions that are no longer needed.
        - Improve application security by preventing reuse of an active session.
        - Support logout functionality across web and mobile applications.

        ## Notes

        - Deleting a session immediately invalidates the associated `session_id`.
        - Once deleted, the session cannot be restored or reused.
        - To access authenticated endpoints again, you must complete the authentication workflow and create a new session.
        - Deleting a session signs the user out of your application but does not revoke the user's TMDB account or API credentials.
      operationId: deleteSession
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  description: The active session ID to delete.
              required:
              - session_id
            example:
              session_id: '{{session_id}}'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeleteResponse'
              example:
                success: true
        '401':
          description: |-
            Unauthorized. TMDB could not validate the credentials, token, or session supplied with the request.

            **Possible causes**

            - The provided **session_id** is invalid.
            - The session has already expired.
            - The request contains an incorrect or malformed session ID.

            **How to fix it**

            - Verify that the **session_id** is valid.
            - Generate a new session if the existing session has expired.
            - Ensure the session ID is correctly referenced from your environment.

            See [Errors](/errors/overview) for the full list of TMDB status codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                status_code: 3
                status_message: 'Authentication failed: You do not have permissions to access the service.'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: TMDB API Read Access Token supplied in the Authorization header as a Bearer token.
