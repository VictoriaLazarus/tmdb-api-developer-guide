              schema:
                $ref: '#/components/schemas/AccountActionResponse'
              example:
                success: true
                status_code: 1
                status_message: Success.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id003
                success: false
                status_code: 18
                status_message: Validation failed.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id001
      tags:
        - Account
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      description: "Adds or removes a movie or TV show from an authenticated user's favorites.\n\n# Prerequisites\n\nBefore
        calling this endpoint, ensure that you have:\n\n1. Completed the TMDB authentication workflow.\n    \n2. Obtained
        a valid `session_id`.\n    \n3. Retrieved the authenticated user's `account_id`.\n    \n4. Identified the TMDB ID
        of the movie or TV show you want to update.\n    \n\n# Path parameters\n\n| Parameter | Type | Required | Description
        |\n| --- | --- | --- | --- |\n| `account_id` | Integer | Yes | The unique identifier of the authenticated TMDB account.
        |\n\n# Query parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| `session_id`
        | String | Yes | The authenticated user's session identifier. |\n\n# Request body\n\n| Field | Type | Required | Description
        |\n| --- | --- | --- | --- |\n| `media_type` | String | Yes | The type of media. Accepted values are `movie` and `tv`.
        |\n| `media_id` | Integer | Yes | The TMDB identifier of the movie or TV show. |\n| `favorite` | Boolean | Yes | Determines
        whether the item is added to (`true`) or removed from (`false`) the favorites list. |\n\n# Example request\n\n**Add
        a movie to favorites**\n\n```\nPOST {{base_url}}/account/{{account_id}}/favorite?session_id={{session_id}}\n\n ```\n\
        \n``` json\n{\n  \"media_type\": \"movie\",\n  \"media_id\": 550,\n  \"favorite\": true\n}\n\n ```\n\n**Remove a movie
        from favorites**\n\n```\nPOST {{base_url}}/account/{{account_id}}/favorite?session_id={{session_id}}\n\n ```\n\n```
        json\n{\n  \"media_type\": \"movie\",\n  \"media_id\": 550,\n  \"favorite\": false\n}\n\n ```\n\n# Example success
        response\n\n``` json\n{\n  \"success\": true,\n  \"status_code\": 1,\n  \"status_message\": \"Success.\"\n}\n\n ```\n\
        \n## Endpoint-specific error\n\n| **Error status** | **Description** | Example response | **Possible causes** | Solution
        |\n| --- | --- | --- | --- | --- |\n| 400 | Bad request | `{ \"success\": false, \"status_code\": 18, \"status_message\"\
        : \"Validation failed.\" }` | \\* Missing media_type.  <br>\\* Missing media_id.  <br>\\* Missing favorite.  <br>Invalid
        media_type (must be movie or tv).  <br>\\* Invalid or malformed JSON request body. | Ensure that all required request
        body fields are present, media_type is either movie or tv, and the JSON body is properly formatted. |\n| 401 | Unauthorized
        | `{ \"success\": false, \"status_code\": 3, \"status_message\": \"Authentication failed: You do not have permissions
        to access the service.\" }` | \\* Missing or invalid session_id.  <br>\\* Expired session.  <br>\\* Missing or invalid
        Bearer token.  <br>\\* The session_id does not belong to the specified account. | Verify that the Bearer token is
        valid, the session_id is active, and the supplied account_id matches the authenticated user. |\n\n# Common use cases\n\
        \n- Allow users to save favorite movies.\n    \n- Allow users to save favorite TV shows.\n    \n- Build personalized
        user profiles.\n    \n- Synchronize favorite content across multiple devices.\n    \n- Create \"My Favorites\" sections
        within an application.\n    \n\n**Note**: This endpoint is **idempotent** with respect to the `favorite` field. Sending
        the same request multiple times with the same value (for example, `favorite: true` for an item that is already favorited)
        does not create duplicate entries. Likewise, setting `favorite` to `false` for an item that is not currently in the
        favorites list ensures it is not marked as a favorite. By specifying the media type, media identifier, and a boolean
        value indicating whether the item should be favorited, the endpoint allows applications to manage a user's favorites
        list."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_type:
                  type: string
                media_id:
                  type: integer
                favorite:
                  type: boolean
              required:
                - media_type
                - media_id
                - favorite
            example:
              media_type: movie
              media_id: 550
              favorite: true
        required: true
      operationId: addFavorite
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        example: '{{account_id}}'
