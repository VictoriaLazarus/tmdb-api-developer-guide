        \nTip: A **custom list** differs from a **favorites list** or **watchlist**. Favorites and watchlists are system-managed
        collections with predefined purposes, whereas custom lists allow users to create their own named collections and organize
        movies however they choose.\n\nFor example, a user might create lists such as:\n\n- _Best Sci-Fi Movies_\n    \n-
